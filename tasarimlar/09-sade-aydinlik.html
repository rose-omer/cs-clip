  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sayi = (x, d = 0) => (x == null || isNaN(x)) ? '–'
    : Number(x).toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const kucuk = (s) => String(s || '').toLocaleLowerCase('tr');
  const haritaAnahtar = (h) => h ? String(h).replace(/^(de|cs|ar)_/, '').toLowerCase() : 'bilinmiyor';
  function haritaAd(h) {
    if (!h) return null;
    const a = String(h).replace(/^(de|cs|ar)_/, '').replace(/_/g, ' ');
    return a.charAt(0).toUpperCase() + a.slice(1);
  }
  const harf = (h) => h ? haritaAd(h).charAt(0) : '?';
  const silahAd = (s) => SILAH[s] || String(s || '?').replace(/^weapon_/, '');
  const nedenAd = (n) => NEDEN[n] || String(n || 'bilinmiyor').replace(/_/g, ' ');
  const ratingSinif = (r) => r >= 1.1 ? 'iyi' : r < 0.9 ? 'kotu' : 'orta';
  const esik = (v, iyi, kotu) => v == null ? '' : v >= iyi ? 'c-iyi' : v < kotu ? 'c-kotu' : '';
  function tarihUzun(t) {
    const d = new Date(t);
    if (isNaN(d)) return String(t || '');
    return d.toLocaleString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function tarihKisa(t) {
    const d = new Date(t);
    if (isNaN(d)) return '';
    const saat = d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    const bugun = new Date(); bugun.setHours(0, 0, 0, 0);
    const gun = new Date(d); gun.setHours(0, 0, 0, 0);
    const fark = Math.round((bugun - gun) / 864e5);
    if (fark === 0) return `Bugün ${saat}`;
    if (fark === 1) return `Dün ${saat}`;
    const o = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== bugun.getFullYear()) o.year = 'numeric';
    return `${d.toLocaleDateString('tr-TR', o)} ${saat}`;
  }
  const uzanti = (ad) => (String(ad).match(/\.dem(\.\w+)?$/i) || [''])[0];
  const basHarf = (ad) => String(ad).replace(/[^\p{L}\p{N}]/gu, '').slice(0, 2).toUpperCase() || '?';

  const demoBul = (id) => D.demolar.find((d) => d.id === id);
  const demoHarita = (d) => d.harita || (d.analiz_edildi && D.demo[d.id] ? D.demo[d.id].harita : null);
  function benBul(s) {
    return (s.oyuncular || []).find((o) => o.ben)
      || (s.oyuncular || []).find((o) => String(o.steamid) === String(s.oyuncu_steamid)) || null;
  }
  function skorBilgi(s) {
    const ben = benBul(s);
    const bizI = s.benim_takim ?? (ben ? ben.takim : 0);
    const t = s.takimlar || [];
    const biz = (t[bizI] || { skor: 0 }).skor, on = (t[1 - bizI] || { skor: 0 }).skor;
    return { bizI, biz, on, ben, sonuc: biz > on ? 'g' : biz < on ? 'm' : 'n' };
  }
  const SONUC_AD = { g: 'Galibiyet', m: 'Mağlubiyet', n: 'Berabere' };

  /* ---------- simgeleri yerleştir ---------- */
  function simgeleriKoy(kok = document) {
    kok.querySelectorAll('i[data-ik]').forEach((el) => {
      el.outerHTML = ik(el.dataset.ik, Number(el.dataset.s) || 16);
    });
  }

  /* ---------- segment kontrol ---------- */
  function segGuncelle(seg, ilk) {
    const th = seg.querySelector('.seg-th');
    const b = seg.querySelector('button[aria-pressed="true"]');
    if (!th || !b) return;
    if (ilk) seg.classList.add('ilk');
    th.style.left = b.offsetLeft + 'px';
    th.style.width = b.offsetWidth + 'px';
    if (ilk) requestAnimationFrame(() => requestAnimationFrame(() => seg.classList.remove('ilk')));
  }
  function segBas(btn) {
    const seg = btn.closest('.seg');
    seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    segGuncelle(seg);
  }
  const tumSegler = (ilk) => document.querySelectorAll('.seg').forEach((s) => segGuncelle(s, ilk));

  /* ---------- bildirim ---------- */
  function bildir(tur, baslik, metin = '', sure = 3800) {
    const ikonAd = { ok: 'tamamDaire', err: 'hata', info: 'bilgi' }[tur] || 'bilgi';
    const el = document.createElement('div');
    el.className = `toast ${tur}`;
    el.setAttribute('role', tur === 'err' ? 'alert' : 'status');
    el.innerHTML = `${ik(ikonAd)}<div><b>${esc(baslik)}</b>${metin ? `<span>${esc(metin)}</span>` : ''}</div>`;
    $('toasts').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, sure);
  }

  /* ---------- tema ---------- */
  function temaUygula(t, sessiz) {
    S.tema = t;
    const k = document.documentElement;
    if (t === 'acik') k.dataset.theme = 'light';
    else if (t === 'koyu') k.dataset.theme = 'dark';
    else delete k.dataset.theme;
    try { localStorage.setItem('csklip-tema', t); } catch (e) { /* depolama kapalı olabilir */ }
    const seg = $('temaSeg');
    seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
    segGuncelle(seg, sessiz);
  }

  /* =========================================================
     KENAR ÇUBUĞU
     ========================================================= */
  function kenarCiz() {
    $('demoSay').textContent = D.demolar.length;
    $('demoListe').innerHTML = D.demolar.map((d) => {
      const h = demoHarita(d);
      const s = d.analiz_edildi ? D.demo[d.id] : null;
      let pill = '<span class="pill n">Analiz bekliyor</span>';
      if (s) { const k = skorBilgi(s); pill = `<span class="pill ${k.sonuc}" aria-label="${SONUC_AD[k.sonuc]}">${k.biz}–${k.on}</span>`; }
      if (S.analiz[d.id] && S.analiz[d.id].durum === 'calisiyor') pill = '<span class="pill a"><span class="spin xs"></span>Analiz</span>';
      const is = S.isler[d.id];
      const alt = [tarihKisa(d.tarih)];
      if (is && is.durum === 'calisiyor') alt.push('<span class="live">Kayıt sürüyor…</span>');
      else if (d.klip_sayisi) alt.push(`${d.klip_sayisi} klip`);
      else if (!d.analiz_edildi) alt.push(`${sayi(d.boyut_mb, 0)} MB`);
      return `<li><button class="demo ${d.id === S.secili ? 'on' : ''}" data-act="demo" data-id="${esc(d.id)}" ${d.id === S.secili ? 'aria-current="page"' : ''}>
        <span class="mt" data-map="${haritaAnahtar(h)}" aria-hidden="true">${esc(harf(h))}</span>
        <span class="demo-g"><span class="demo-u"><b>${esc(haritaAd(h) || 'Bilinmeyen harita')}</b>${pill}</span>
        <span class="demo-a">${alt.join(' · ')}</span></span></button></li>`;
    }).join('');
    yuklemeCiz();
    durumCiz();
  }

  function durumCiz() {
    const k = D.kontrol || { hazir: false, sorunlar: [] };
    const el = $('durum');
    if (S.kontrolBakiliyor) {
      el.innerHTML = '<div class="status"><span class="spin xs" style="margin-top:3px"></span><div><b>Kontrol ediliyor…</b>CS2, FACEIT ve kayıt araçları</div></div>';
      return;
    }
    el.innerHTML = k.hazir
      ? '<div class="status ok"><span class="dot"></span><div><b>Kayıt için hazır</b>CS2 ve FACEIT kapalı</div></div>'
      : `<div class="status warn"><span class="dot"></span><div><b>Kayıt hazır değil</b>${esc((k.sorunlar || [])[0] || 'Bilinmeyen sorun')}
          <div><button class="lnk" data-act="kontrol">Tekrar kontrol et</button></div></div></div>`;
  }

  function yuklemeCiz() {
    $('yuklemeler').innerHTML = S.yuklemeler.map((y) => `<div class="up">
      <div class="up-u"><span title="${esc(y.ad)}">${esc(y.ad)}</span><span>${Math.floor(y.oran)}%</span></div>
      <div class="bar"><i style="width:${y.oran}%"></i></div></div>`).join('');
  }

  /* =========================================================
     ÜST ÇUBUK
     ========================================================= */
  function ustCiz(d) {
    if (!d) { $('crumb').innerHTML = '<b>Demolar</b>'; return; }
    const h = demoHarita(d);
    const s = d.analiz_edildi ? D.demo[d.id] : null;
    const k = s ? skorBilgi(s) : null;
    $('crumb').innerHTML = `<span class="root">Demolar</span><span class="sl">/</span><b>${esc(haritaAd(h) || 'Bilinmeyen harita')}</b>
      ${k ? `<span class="pill ${k.sonuc}">${SONUC_AD[k.sonuc]}</span>` : '<span class="pill n">Analiz bekliyor</span>'}`;
  }

  /* =========================================================
     ANA İÇERİK
     ========================================================= */
  function anaCiz() {
    const d = demoBul(S.secili);
    ustCiz(d);
    const m = $('icerik');
    if (!d) {
      m.innerHTML = `<section class="card empty sec"><div class="empty-ic">${ik('film', 20)}</div>
        <h2>Bir demo seç</h2><p>Soldaki listeden bir demo seç ya da yeni bir .dem dosyası yükle.</p></section>`;
      return;
    }
    if (!d.analiz_edildi) { m.innerHTML = analizGorunum(d); return; }
    const s = D.demo[d.id];
    m.innerHTML = [
      macBaslik(d, s),
      performans(s),
      skorKart(),
      `<div class="duo">${roundKart(s)}${silahKart(s)}</div>`,
      klipKart(d),
    ].join('');
    tablolariCiz();
    klipIcerikCiz();
    tumSegler(true);
  }

  /* ---------- maç başlığı ---------- */
  function macBaslik(d, s) {
    const k = skorBilgi(s);
    const t = s.takimlar || [];
    const rl = [...(s.roundlar || [])].sort((a, b) => a.no - b.no);
    const devre = (bas, son) => {
      const g = rl.filter((r) => r.no >= bas && r.no <= son);
      return { biz: g.filter((r) => r.kazanan_takim === k.bizI).length, on: g.filter((r) => r.kazanan_takim !== k.bizI).length, n: g.length };
    };
    const d1 = devre(1, 12), d2 = devre(13, 24), uz = devre(25, 999);
    const serit = rl.map((r) => `${r.no === 13 || (r.no > 24 && (r.no - 25) % 6 === 0) ? '<i class="gap"></i>' : ''}<i class="${r.kazanan_takim === k.bizI ? 'w' : ''}" data-tip="Round ${r.no} · ${r.kazanan_takim === k.bizI ? 'kazandınız' : 'kaybettiniz'}"></i>`).join('');
    const h = s.harita || demoHarita(d);
    return `<section class="card match sec" style="--i:0">
      <div class="match-top">
        <div class="match-l">
          <span class="mt lg" data-map="${haritaAnahtar(h)}" aria-hidden="true">${esc(harf(h))}</span>
          <div style="min-width:0">
            <div class="eyebrow">Maç özeti</div>
            <h1>${esc(haritaAd(h) || 'Bilinmeyen harita')}</h1>
            <div class="meta">
              <span>${ik('takvim', 13)}${esc(tarihUzun(d.tarih))}</span>
              <span>${ik('bayrak', 13)}${s.round_sayisi ?? rl.length} round</span>
              <span>${ik('disk', 13)}${sayi(d.boyut_mb, 1)} MB · ${esc(uzanti(d.ad))}</span>
            </div>
          </div>
        </div>
        <div class="scoreline">
          <div class="tm l">${esc((t[k.bizI] || {}).ad || 'Takımın')}<small>Takımın</small></div>
          <div class="bigscore" aria-label="Skor ${k.biz} - ${k.on}">
            <span class="${k.sonuc === 'm' ? 'lo' : ''}">${k.biz}</span><span class="sep">:</span><span class="${k.sonuc === 'g' ? 'lo' : ''}">${k.on}</span>
          </div>
          <div class="tm r">${esc((t[1 - k.bizI] || {}).ad || 'Rakip')}<small>Rakip</small></div>
        </div>
      </div>
      <div class="match-f">
        <span class="pill ${k.sonuc}">${SONUC_AD[k.sonuc]}</span>
        <span>1. devre <b>${d1.biz}–${d1.on}</b></span>
        ${d2.n ? `<span>2. devre <b>${d2.biz}–${d2.on}</b></span>` : ''}
        ${uz.n ? `<span>Uzatma <b>${uz.biz}–${uz.on}</b></span>` : ''}
        <div class="strip" aria-hidden="true">${serit}</div>
      </div>
    </section>`;
  }

  /* ---------- benim istatistiklerim ---------- */
  function performans(s) {
    const o = benBul(s);
    if (!o) {
      return `<section class="card empty sec" style="--i:1"><div class="empty-ic">${ik('uyari', 20)}</div>
        <h2>Bu demoda sen yoksun</h2><p>ayarlar.json içindeki oyuncu_steamid bu maçtaki hiçbir oyuncuyla eşleşmedi.</p></section>`;
    }
    const L = s.oyuncular || [];
    const lobi = (k) => {
      const v = L.map((x) => x[k]).filter((x) => x != null);
      const min = Math.min(...v), max = Math.max(...v);
      return { min, max, ort: v.reduce((a, b) => a + b, 0) / v.length, sira: 1 + v.filter((x) => x > o[k]).length, n: v.length };
    };
    const konum = (x, l) => l.max === l.min ? 50 : (x - l.min) / (l.max - l.min) * 100;
    const kutu = (ad, k, ond, birim, ipucu) => {
      const l = lobi(k), v = o[k], fark = v - l.ort;
      return `<div class="card tile">
        <div class="tile-h"><span data-tip="${esc(ipucu)}">${ad}</span><span class="rank" data-tip="Lobideki sıran">${l.sira}. / ${l.n}</span></div>
        <div class="tile-v">${sayi(v, ond)}${birim ? `<small>${birim}</small>` : ''}</div>
        <div class="range" data-tip="Lobi aralığı: ${sayi(l.min, ond)} – ${sayi(l.max, ond)}\nÇizgi: lobi ortalaması ${sayi(l.ort, ond)}">
          <i class="range-fill" style="width:${Math.max(3, konum(v, l))}%"></i><i class="range-avg" style="left:${konum(l.ort, l)}%"></i></div>
        <div class="tile-f"><span class="delta ${fark >= 0 ? 'pos' : 'neg'}">${fark >= 0 ? '+' : '−'}${sayi(Math.abs(fark), ond)}${birim === '%' ? ' puan' : ''}</span> lobi ortalamasına göre</div>
      </div>`;
    };

    // rating göstergesi (0–2 ölçeği; 1,00 ortalama)
    const r = o.rating ?? 0;
    const p = Math.max(0, Math.min(100, r / 2 * 100));
    const rs = ratingSinif(r);
    const hukum = rs === 'iyi' ? ['g', 'Ortalamanın üstünde'] : rs === 'kotu' ? ['m', 'Ortalamanın altında'] : ['n', 'Ortalama civarı'];
    const rl = lobi('rating');
    const fark = o.kill - o.death;
    const gosterge = `<div class="card tile rating">
      <div class="tile-h"><span data-tip="HLTV 1.0 rating\n1,00 = ortalama oyuncu">Rating</span><span class="rank" data-tip="Lobideki sıran">${rl.sira}. / ${rl.n}</span></div>
      <div class="rating-in">
        <div class="gauge">
          <svg viewBox="0 0 200 112" role="img" aria-label="Rating ${sayi(r, 2)}">
            <path class="trk" d="M16 100 A84 84 0 0 1 184 100" fill="none" stroke-width="11" stroke-linecap="round"/>
            <path class="val" d="M16 100 A84 84 0 0 1 184 100" fill="none" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="${100 - p}"/>
            <line class="tick" x1="100" y1="2" x2="100" y2="9" stroke-width="1.5" stroke-linecap="round"/>
            <text x="16" y="111" text-anchor="middle">0</text><text x="184" y="111" text-anchor="middle">2,0</text>
          </svg>
          <div class="gauge-c"><b>${sayi(r, 2)}</b><span class="pill ${hukum[0]}">${hukum[1]}</span></div>
        </div>
        <div class="r-sub">
          <div><b>${o.kill}<span class="dim"> / </span>${o.death}<span class="dim"> / </span>${o.assist}</b>K / D / A</div>
          <div><b class="${fark > 0 ? 'c-iyi' : fark < 0 ? 'c-kotu' : ''}">${fark > 0 ? '+' : fark < 0 ? '−' : ''}${Math.abs(fark)}</b>Fark</div>
          <div><b>${sayi(rl.ort, 2)}</b>Lobi ort.</div>
        </div>
      </div>
    </div>`;

    const ak = o.acilis_kill ?? 0, ad = o.acilis_death ?? 0, top = ak + ad;
    const acilis = `<div class="card tile">
      <div class="tile-h"><span data-tip="Roundun ilk kill'i için girdiğin düellolar">Açılış düelloları</span><span class="rank">${top} düello</span></div>
      <div class="tile-v">${ak}<small> / ${ad}</small></div>
      <div class="split" data-tip="${ak} kazanılan · ${ad} kaybedilen">${top ? `<i style="flex:${ak}"></i><i class="d" style="flex:${ad}"></i>` : '<i class="e"></i>'}</div>
      <div class="tile-f">${top ? `<span class="delta ${ak >= ad ? 'pos' : 'neg'}">${sayi(ak / top * 100, 0)}%</span> kazanma oranı` : 'Açılış düellosu yok'}</div>
    </div>`;

    const ck = o.cok_kill || {};
    const ckToplam = ['2', '3', '4', '5'].reduce((a, x) => a + (ck[x] || 0), 0);
    const coklu = `<div class="card tile">
      <div class="tile-h"><span data-tip="Tek roundda birden fazla kill aldığın roundlar">Çoklu kill</span><span class="rank">${ckToplam} round</span></div>
      <div class="mk">${[['2', '2K'], ['3', '3K'], ['4', '4K'], ['5', 'ACE']].map(([x, a]) =>
        `<div class="${ck[x] ? 'on' : 'z'}"><b>${ck[x] || 0}</b><span>${a}</span></div>`).join('')}</div>
      <div class="tile-f" style="padding-top:8px">${ckToplam ? `${o.kill} kill'in ${['2', '3', '4', '5'].reduce((a, x) => a + (ck[x] || 0) * Number(x), 0)} tanesi çoklu` : 'Bu maçta çoklu kill yok'}</div>
    </div>`;

    return `<div class="sec-t sec" style="--i:1"><h2>Performansın · ${esc(o.ad)}</h2><span>Lobideki 10 oyuncuyla karşılaştırma</span></div>
      <div class="tiles sec" style="--i:1">
        ${gosterge}
        ${kutu('ADR', 'adr', 1, '', 'Round başına ortalama hasar')}
        ${kutu('KAST', 'kast', 1, '%', 'Kill, asist, hayatta kalma ya da takas edilme olan roundların oranı')}
        ${kutu('K/D', 'kd', 2, '', 'Kill / ölüm oranı')}
        ${kutu('HS', 'hs_yuzde', 1, '%', 'Kafadan vuruşla alınan kill oranı')}
        ${acilis}
        ${coklu}
      </div>`;
  }

  /* ---------- skor tablosu ---------- */
  function skorKart() {
    return `<section class="card sec" id="skor" style="--i:2">
      <header class="card-h"><div><h2>Skor tablosu</h2><p>Sıralamak için sütun başlığına tıkla</p></div>
        <div class="seg" role="group" aria-label="Takım filtresi"><span class="seg-th"></span>
          ${[['tum', 'Tümü'], ['biz', 'Takımın'], ['on', 'Rakip']].map(([f, a]) =>
            `<button data-act="filtre" data-f="${f}" aria-pressed="${S.filtre === f}">${a}</button>`).join('')}
        </div></header>
      <div id="takimlar" style="margin-top:8px"></div>
    </section>`;
  }
  const KOLON = [
    { k: 'ad', ad: 'Oyuncu' }, { k: 'kill', ad: 'K' }, { k: 'death', ad: 'D' }, { k: 'assist', ad: 'A', opt: 1 },
    { k: 'fark', ad: '+/−', opt: 1 }, { k: 'adr', ad: 'ADR' }, { k: 'hs_yuzde', ad: 'HS%', opt: 1 },
    { k: 'kast', ad: 'KAST' }, { k: 'rating', ad: 'Rating' },
  ];
  function tablolariCiz() {
    const kutu = $('takimlar');
    const d = demoBul(S.secili);
    if (!kutu || !d) return;
    const s = D.demo[d.id];
    const k = skorBilgi(s);
    const { k: anahtar, azalan } = S.sira;
    const deger = (o, a) => a === 'fark' ? o.kill - o.death : o[a];
    const sirala = (a, b) => {
      const x = deger(a, anahtar), y = deger(b, anahtar);
      const c = anahtar === 'ad' ? String(x).localeCompare(String(y), 'tr') : (x ?? -1) - (y ?? -1);
      return azalan ? -c : c;
    };
    const takimlar = [k.bizI, 1 - k.bizI].filter((t) => S.filtre === 'tum' || (S.filtre === 'biz') === (t === k.bizI));
    kutu.innerHTML = takimlar.map((t) => {
      const tk = (s.takimlar || [])[t] || { ad: `Takım ${t + 1}`, skor: '' };
      const sonuc = tk.kazandi ? 'g' : (s.takimlar || []).some((x) => x.kazandi) ? 'm' : 'n';
      const oyuncular = (s.oyuncular || []).filter((o) => o.takim === t).sort(sirala);
      return `<div class="team">
        <div class="team-h"><b>${esc(tk.ad)}</b><span class="muted">${t === k.bizI ? 'Takımın' : 'Rakip'}</span>
          <span class="ts"><span class="pill ${sonuc}">${SONUC_AD[sonuc]}</span>${esc(tk.skor)}</span></div>
        <div class="tw"><table class="sb">
          <thead><tr>${KOLON.map((c) => {
            const on = c.k === anahtar;
            return `<th class="${c.opt ? 'opt' : ''} ${on ? 'on' : ''}" ${on ? `aria-sort="${azalan ? 'descending' : 'ascending'}"` : ''}>
              <button data-act="sira" data-k="${c.k}">${c.ad}${on ? ik(azalan ? 'asagi' : 'yukari', 10, 'ar') : ''}</button></th>`;
          }).join('')}</tr></thead>
          <tbody>${oyuncular.map((o) => {
            const f = o.kill - o.death;
            return `<tr class="${o.ben ? 'me' : ''}">
              <td><div class="pl"><span class="av" aria-hidden="true">${esc(basHarf(o.ad))}</span><span class="n" title="${esc(o.ad)} · ${esc(o.steamid)}">${esc(o.ad)}</span>${o.ben ? '<span class="you">Sen</span>' : ''}</div></td>
              <td>${o.kill}</td><td>${o.death}</td><td class="opt dim">${o.assist}</td>
              <td class="opt ${f > 0 ? 'c-iyi' : f < 0 ? 'c-kotu' : 'dim'}">${f > 0 ? '+' : f < 0 ? '−' : ''}${Math.abs(f)}</td>
              <td class="${esik(o.adr, 85, 65)}">${sayi(o.adr, 1)}</td>
              <td class="opt">${sayi(o.hs_yuzde, 0)}%</td>
              <td class="${esik(o.kast, 75, 65)}">${sayi(o.kast, 1)}%</td>
              <td><span class="rt ${ratingSinif(o.rating)}">${sayi(o.rating, 2)}</span></td></tr>`;
          }).join('')}</tbody>
        </table></div></div>`;
    }).join('');
  }

  /* ---------- round zaman çizelgesi ---------- */
  function roundKart(s) {
    const k = skorBilgi(s);
    const rl = [...(s.roundlar || [])].sort((a, b) => a.no - b.no);
    if (!rl.length) return `<section class="card sec" style="--i:3"><div class="card-b"><p class="muted">Round bilgisi yok.</p></div></section>`;
    const gruplar = [];
    for (let i = 0; i < rl.length;) {
      const no = rl[i].no;
      const bas = no <= 12 ? 1 : no <= 24 ? 13 : 25 + Math.floor((no - 25) / 6) * 6;
      const son = no <= 24 ? bas + 11 : bas + 5;
      const g = rl.filter((r) => r.no >= bas && r.no <= son);
      gruplar.push({ ad: bas === 1 ? '1. devre' : bas === 13 ? '2. devre' : `Uzatma ${(bas - 25) / 6 + 1}`, g });
      i += g.length;
    }
    const kazanilan = rl.filter((r) => r.kazanan_takim === k.bizI).length;
    const killRound = rl.filter((r) => r.benim_kill > 0).length;
    const hayatta = rl.filter((r) => !r.ben_oldum).length;
    const coklu = rl.filter((r) => r.benim_kill >= 2).length;
    return `<section class="card sec" id="roundlar" style="--i:3">
      <header class="card-h"><div><h2>Round akışı</h2><p>Her kutu bir round; içindeki sayı senin kill sayın</p></div></header>
      <div class="card-b">
        <div class="rsum">
          <div><b>${kazanilan}<small> / ${rl.length}</small></b>Kazanılan round</div>
          <div><b>${killRound}</b>Kill aldığın round</div>
          <div><b>${hayatta}</b>Hayatta kaldığın</div>
          <div><b>${coklu}</b>Çoklu kill roundu</div>
        </div>
        ${gruplar.map((gr) => {
          const w = gr.g.filter((r) => r.kazanan_takim === k.bizI).length;
          return `<div class="half"><div class="half-l"><b>${w}–${gr.g.length - w}</b>${gr.ad}</div>
            <div class="rgrid">${gr.g.map((r) => {
              const biz = r.kazanan_takim === k.bizI;
              const tip = [`Round ${r.no} · ${biz ? 'Kazandınız' : 'Kaybettiniz'}`, nedenAd(r.neden),
                r.benim_kill ? `${r.benim_kill} kill aldın` : 'Kill yok', r.ben_oldum ? 'Öldün' : 'Hayatta kaldın'].join('\n');
              return `<div class="r"><div class="rc ${biz ? 'w' : 'l'}" data-tip="${esc(tip)}">${r.benim_kill || ''}</div>
                <i class="rd ${r.ben_oldum ? 'on' : ''}"></i><span class="rn">${r.no}</span></div>`;
            }).join('')}</div></div>`;
        }).join('')}
        <div class="legend">
          <span><i class="w"></i>Takımın kazandı</span><span><i class="l"></i>Rakip kazandı</span><span><i class="d"></i>Öldün</span>
        </div>
      </div>
    </section>`;
  }

  /* ---------- silah dağılımı ---------- */
  function silahKart(s) {
    const liste = [...(s.silahlar || [])].sort((a, b) => b.kill - a.kill);
    const toplam = liste.reduce((a, x) => a + x.kill, 0);
    const hsT = liste.reduce((a, x) => a + Math.min(x.hs || 0, x.kill), 0);
    const enCok = Math.max(1, ...liste.map((x) => x.kill));
    return `<section class="card sec" style="--i:3">
      <header class="card-h"><div><h2>Silahlar</h2><p>${toplam} kill · ${toplam ? sayi(hsT / toplam * 100, 0) : 0}% headshot</p></div></header>
      <div class="card-b">
        ${liste.length ? `<div class="wl">${liste.map((x) => {
          const hs = Math.min(x.hs || 0, x.kill);
          return `<div class="wr" data-tip="${esc(silahAd(x.silah))}: ${x.kill} kill, ${hs} headshot">
            <span class="wa">${esc(silahAd(x.silah))}</span>
            <div class="wb"><i class="hs" style="width:${hs / enCok * 100}%"></i><i class="ot" style="width:${(x.kill - hs) / enCok * 100}%"></i></div>
            <span class="wn"><b>${x.kill}</b> · ${hs} HS</span></div>`;
        }).join('')}</div>
        <div class="legend"><span><i class="w"></i>Headshot</span><span><i style="background:var(--accent-mid)"></i>Diğer</span></div>`
        : '<p class="muted" style="margin:0">Bu maçta kill yok.</p>'}
      </div>
    </section>`;
  }

  /* ---------- klipler ---------- */
  function klipKart() {
    return `<section class="card sec" id="klipler" style="--i:4">
      <header class="card-h"><div><h2>Klipler</h2><p id="klipOzet"></p></div>
        <div class="acts">
          <div class="seg" role="group" aria-label="Kaydedilecek klip sayısı"><span class="seg-th"></span>
            ${[3, 5, 0].map((n) => `<button data-act="enIyi" data-n="${n}" aria-pressed="${S.enIyi === n}">${n ? `En iyi ${n}` : 'Hepsi'}</button>`).join('')}
          </div>
          <button class="btn pri" id="kaydetBtn" data-act="kaydet"></button>
        </div></header>
      <div class="card-b">
        <div id="klipUyari"></div>
        <div id="isPanel"></div>
        <div class="cgrid" id="klipIzgara"></div>
      </div>
    </section>`;
  }
  function klipIcerikCiz() { uyariCiz(); isCiz(true); izgaraCiz(); }

  const siraliHl = (id) => [...((D.klipler[id] || {}).highlightlar || [])].sort((a, b) => b.score - a.score);

  function uyariCiz() {
    const el = $('klipUyari');
    if (!el) return;
    const k = D.kontrol || {};
    el.innerHTML = k.hazir
      ? `<div class="callout ok">${ik('kalkan')}<div class="grow"><b>Kayıt için hazır.</b>
          <p>Kayıt CS2'yi açar ve demoyu oynatır; bitene kadar bilgisayarı kullanma.</p></div></div>`
      : `<div class="callout warn" id="uyariKutu">${ik('uyari')}<div class="grow"><b>Kayıt öncesi kontrol geçmedi</b>
          ${(k.sorunlar || []).map((x) => `<p>${esc(x)}</p>`).join('')}</div>
          <button class="btn sm" data-act="kontrol" ${S.kontrolBakiliyor ? 'disabled' : ''}>${S.kontrolBakiliyor ? '<span class="spin xs"></span>Kontrol ediliyor' : `${ik('yenile', 14)}Tekrar kontrol et`}</button></div>`;
  }

  const FAZ = ['Kontrol', 'CS2 + demo', 'Klipler', 'Bitiş'];
  function isCiz(yeniden) {
    const id = S.secili;
    const btn = $('kaydetBtn');
    if (!btn) return;
    const is = S.isler[id];
    const calisiyor = is && is.durum === 'calisiyor';
    const hedefN = S.enIyi ? Math.min(S.enIyi, siraliHl(id).length) : siraliHl(id).length;
    btn.disabled = calisiyor || !siraliHl(id).length;
    btn.innerHTML = calisiyor ? '<span class="spin xs" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>Kayıt sürüyor'
      : `${ik('kayit', 14)}Klipleri kaydet <span class="n">(en iyi ${S.enIyi ? hedefN : 'hepsi'})</span>`;
    document.querySelectorAll('[data-act="enIyi"]').forEach((b) => { b.disabled = !!calisiyor; });

    const hl = siraliHl(id);
    const klipli = hl.filter((h) => h.klip).length;
    const oz = $('klipOzet');
    if (oz) oz.textContent = hl.length ? `${hl.length} highlight · ${klipli} klip kaydedildi` : 'Bu maçta öne çıkan an bulunamadı';

    const panel = $('isPanel');
    if (!is) { panel.innerHTML = ''; return; }
    const yuzde = Math.round(is.adim / is.adimlar.length * 100);
    if (yeniden || !panel.firstElementChild) {
      panel.innerHTML = `<div class="job" id="isKutu">
        <div class="job-h"><span id="isIkon"></span><b id="isBaslik"></b><span class="msg" id="isMesaj"></span><span class="pct" id="isYuzde"></span></div>
        <div class="bar"><i id="isBar"></i></div>
        <ol class="steps" id="isAdim"></ol>
        <details class="log" id="isLogD" ${S.logAcik ? 'open' : ''}><summary>${ik('sag', 13)}Günlük</summary><pre id="isLog"></pre></details>
      </div>`;
    }
    const kutu = $('isKutu');
    kutu.className = `job ${is.durum === 'calisiyor' ? 'run' : is.durum === 'bitti' ? 'done' : ''}`;
    $('isIkon').innerHTML = is.durum === 'calisiyor' ? '<span class="spin" style="display:block"></span>' : `<span class="ok">${ik('tamamDaire')}</span>`;
    $('isBaslik').textContent = is.durum === 'calisiyor' ? 'Kayıt sürüyor' : 'Kayıt tamamlandı';
    $('isMesaj').textContent = is.mesaj;
    $('isYuzde').textContent = `${yuzde}%`;
    requestAnimationFrame(() => { const b = $('isBar'); if (b) b.style.width = yuzde + '%'; });
    $('isAdim').innerHTML = FAZ.map((f, i) => {
      const durum = is.durum === 'bitti' || i < is.faz ? 'done' : i === is.faz ? 'cur' : '';
      const etiket = i === 2 ? `${f} ${is.tamam}/${is.hedef.length}` : f;
      return `<li class="${durum}"><span class="s">${durum === 'done' ? ik('tamam', 10) : durum === 'cur' ? '<span class="spin xs"></span>' : i + 1}</span>${esc(etiket)}</li>`;
    }).join('');
    const log = $('isLog');
    log.textContent = is.satirlar.join('\n');
    log.scrollTop = log.scrollHeight;
  }

  function izgaraCiz() {
    const el = $('klipIzgara');
    if (!el) return;
    const id = S.secili;
    const d = demoBul(id);
    const hl = siraliHl(id);
    const harita = haritaAnahtar(demoHarita(d));
    const is = S.isler[id];
    if (!hl.length) {
      el.innerHTML = '<p class="muted" style="margin:0;grid-column:1/-1">Bu maçta öne çıkan an bulunamadı.</p>';
      return;
    }
    const n = S.enIyi || hl.length;
    el.innerHTML = hl.map((h, i) => {
      const etk = h.labels || [];
      const baslik = etk.find((l) => /clutch/i.test(l)) || etk.find((l) => /^(\dK|ACE)$/i.test(l)) || etk[0] || 'Highlight';
      const diger = etk.filter((l) => l !== baslik);
      const kSay = (() => { const m = etk.find((l) => /^\dK$/i.test(l)); return m ? Number(m[0]) : etk.some((l) => /ACE/i.test(l)) ? 5 : 1; })();
      const kayitli = !!h.klip;
      const hedef = i < n;
      const sure = `0:${String(h.saniye ?? 0).padStart(2, '0')}`;
      const kfW = [64, 52, 72, 46, 60];
      const sirada = is && is.durum === 'calisiyor' && is.hedef.includes(h) && !h.klip;
      const st = kayitli ? `<span class="st ok">${ik('tamamDaire', 13)}Kaydedildi</span>`
        : sirada ? '<span class="st q"><span class="spin xs"></span>Sırada</span>'
        : hedef ? '<span class="st q">Kayda dahil</span>' : '<span class="st">Kaydedilmedi</span>';
      return `<article class="clip ${kayitli ? 'ok' : 'yok'} ${hedef ? 'hedef' : ''} ${S.yeni === h.round ? 'yeni' : ''}">
        <div class="thumb" data-map="${harita}">
          <div class="sky s${h.round % 3}"></div>
          <div class="kf" aria-hidden="true">${Array.from({ length: Math.min(kSay, 5) }, (_, j) => `<i style="width:${kfW[j]}px"></i>`).join('')}</div>
          <span class="tb tl">R${esc(h.round)}</span>
          <span class="tb bl">#${i + 1}</span>
          <span class="tb br">${sure}</span>
          ${kayitli ? `<button class="play" data-act="oynat" data-r="${esc(h.round)}" aria-label="Round ${esc(h.round)} klibini oynat">${ik('oynat', 18)}</button>`
            : `<span class="tb mid">${ik('film', 13)}Kaydedilmedi</span>`}
        </div>
        <div class="clip-b">
          <div class="clip-t"><b>${esc(baslik)}</b>
            <span class="sc" data-tip="Highlight puanı\nKill, headshot, clutch ve hıza göre">
              <span class="meter"><i style="width:${Math.min(100, h.score / 14 * 100)}%"></i></span>${sayi(h.score, 1)}</span></div>
          <div class="chips">${diger.map((l) => `<span class="chip ${/clutch|^\dK$|ACE/i.test(l) ? 'a' : ''}">${esc(l)}</span>`).join('')}<span class="chip">Round ${esc(h.round)}</span></div>
          <div class="clip-m"><span title="${esc((h.weapons || []).map(silahAd).join(', '))}">${esc((h.weapons || []).map(silahAd).join(', ') || '—')}</span>${st}</div>
        </div>
      </article>`;
    }).join('');
  }

  /* ---------- analiz edilmemiş demo ---------- */
  function analizGorunum(d) {
    const a = S.analiz[d.id];
    const calisiyor = a && a.durum === 'calisiyor';
    return `<section class="card empty sec">
      <div class="empty-ic">${ik('dosya', 20)}</div>
      <h2>Bu demo henüz analiz edilmedi</h2>
      <p>Analiz; skor tablosunu, round akışını, silah dağılımını ve highlight'ları çıkarır. Büyük demolarda bir dakika kadar sürebilir.</p>
      <div class="file"><span class="mono" title="${esc(d.ad)}">${esc(d.ad)}</span><span>${sayi(d.boyut_mb, 1)} MB</span></div>
      ${calisiyor ? `<div class="bar"><i id="analizBar" style="width:${a.oran}%"></i></div><p class="msg" id="analizMsg">${esc(a.mesaj)}</p>` : ''}
      ${a && a.durum === 'hata' ? `<div class="callout warn">${ik('uyari')}<div class="grow"><b>Analiz yapılamadı</b><p>${esc(a.mesaj)}</p></div></div>` : ''}
      <button class="btn pri" data-act="analiz" ${calisiyor ? 'disabled' : ''}>${calisiyor ? '<span class="spin xs" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>Analiz ediliyor' : `${ik('akis', 14)}Analiz et`}</button>
    </section>`;
  }

  function analizEt() {
    const id = S.secili;
    const d = demoBul(id);
    if (!d || (S.analiz[id] && S.analiz[id].durum === 'calisiyor')) return;
    const MESAJ = ['Demo açılıyor…', 'Kill olayları okunuyor…', 'Roundlar ve KAST hesaplanıyor…', 'Highlight\'lar puanlanıyor…'];
    const a = S.analiz[id] = { durum: 'calisiyor', oran: 0, mesaj: MESAJ[0] };
    anaCiz(); kenarCiz();
    const zaman = setInterval(() => {
      a.oran = Math.min(100, a.oran + 7 + Math.random() * 9);
      a.mesaj = MESAJ[Math.min(MESAJ.length - 1, Math.floor(a.oran / 25))];
      if (a.oran >= 100) {
        clearInterval(zaman);
        if (D.demo[id]) {
          delete S.analiz[id];
          d.analiz_edildi = true;
          d.harita = d.harita || D.demo[id].harita;
          if (!D.klipler[id]) D.klipler[id] = { highlightlar: [], kayit: { durum: 'bos' } };
          bildir('ok', 'Analiz tamamlandı', `${haritaAd(d.harita)} · ${(D.klipler[id].highlightlar || []).length} highlight bulundu`);
        } else {
          a.durum = 'hata';
          a.mesaj = 'Örnek modda yalnız hazır demolar analiz edilebilir. Gerçek arayüzde bu adımı stats.py yapar.';
        }
        if (S.secili === id) anaCiz();
        kenarCiz();
        return;
      }
      if (S.secili === id) {
        const b = $('analizBar'), m = $('analizMsg');
        if (b) b.style.width = a.oran + '%';
        if (m) m.textContent = a.mesaj;
      }
    }, 260);
  }

  /* ---------- kayıt öncesi kontrol ---------- */
  function kontrolEt() {
    if (S.kontrolBakiliyor) return;
    S.kontrolBakiliyor = true;
    durumCiz(); uyariCiz();
    setTimeout(() => {
      S.kontrolBakiliyor = false;
      D.kontrol = { hazir: true, sorunlar: [] };
      durumCiz(); uyariCiz();
      bildir('ok', 'Kontrol tamam', 'FACEIT ve CS2 kapalı; kayıt başlatılabilir. (örnek mod)');
    }, 1100);
  }

  /* ---------- kayıt simülasyonu ---------- */
  function kaydet() {
    const id = S.secili;
    const d = demoBul(id);
    if (!d || (S.isler[id] && S.isler[id].durum === 'calisiyor')) return;
    if (!D.kontrol.hazir) {
      bildir('err', 'Kayıt başlatılamadı', (D.kontrol.sorunlar || [])[0] || 'Kayıt öncesi kontrol geçmedi.');
      const u = $('uyariKutu');
      if (u) { u.classList.remove('shake'); void u.offsetWidth; u.classList.add('shake'); }
      return;
    }
    const s = D.demo[id];
    const ben = benBul(s);
    const hl = siraliHl(id);
    const hedef = S.enIyi ? hl.slice(0, S.enIyi) : hl;
    const n = hedef.length;
    const harita = haritaAnahtar(demoHarita(d));
    const kisa = (id.split('-')[1] || 'demo').slice(0, 8);
    const adimlar = [
      { s: 'Kayıt öncesi kontrol: tamam', f: 0, m: 'Kontrol ediliyor' },
      { s: 'CS Demo Manager başlatılıyor…', f: 1, m: 'CS Demo Manager başlatılıyor' },
      { s: 'CS2 açılıyor (-insecure, 1920x1080)…', f: 1, m: 'CS2 açılıyor' },
      { s: `Demo yüklendi, oyuncu POV: ${ben ? ben.ad : '?'}`, f: 1, m: 'Demo yükleniyor' },
      ...hedef.flatMap((h, i) => [
        { s: `Round ${h.round} kaydediliyor (${i + 1}/${n})…`, f: 2, m: `Round ${h.round} kaydediliyor (${i + 1}/${n})` },
        { s: 'FFmpeg: NVENC h264 kodlama', f: 2, m: `Round ${h.round} kodlanıyor` },
        { s: `Klip yazıldı: ${harita}_${kisa}_R${h.round}.mp4`, f: 2, m: `Round ${h.round} hazır`, h },
      ]),
      { s: 'CS2 kapatılıyor', f: 3, m: 'CS2 kapatılıyor' },
      { s: `Bitti: ${n} klip kaydedildi`, f: 3, m: `${n} klip kaydedildi`, son: true },
    ];
    const is = S.isler[id] = { durum: 'calisiyor', adim: 0, adimlar, hedef, satirlar: [], mesaj: 'Başlatılıyor…', faz: 0, tamam: 0 };
    isCiz(true); izgaraCiz(); kenarCiz();
    const tur = () => {
      const a = is.adimlar[is.adim];
      is.adim++;
      is.satirlar.push(`[${new Date().toLocaleTimeString('tr-TR')}] ${a.s}`);
      is.mesaj = a.m;
      is.faz = a.f;
      if (a.h) {
        a.h.klip = a.h.klip || `/klip/${harita}_${kisa}_R${a.h.round}.mp4`;
        is.tamam++;
        S.yeni = a.h.round;
      }
      if (a.son) {
        is.durum = 'bitti';
        d.klip_sayisi = (D.klipler[id].highlightlar || []).filter((h) => h.klip).length;
        bildir('ok', 'Klipler kaydedildi', `${haritaAd(demoHarita(d))} · ${n} klip klipler/ klasörüne yazıldı`);
        kenarCiz();
      }
      if (S.secili === id) { isCiz(); if (a.h || a.son || is.adim === 1) izgaraCiz(); }
      S.yeni = null;
      if (!a.son) setTimeout(tur, 520 + Math.random() * 420);
    };
    setTimeout(tur, 400);
  }

  /* ---------- oynatıcı (örnek: gerçek mp4 yok) ---------- */
  let oynatZaman = null;
  function oynatAc(round) {
    const id = S.secili;
    const h = siraliHl(id).find((x) => x.round === round);
    if (!h) return;
    const d = demoBul(id);
    const harita = haritaAnahtar(demoHarita(d));
    const etk = h.labels || [];
    const kSay = (() => { const m = etk.find((l) => /^\dK$/i.test(l)); return m ? Number(m[0]) : 1; })();
    const o = $('oynatici');
    o.innerHTML = `<div class="player" role="dialog" aria-modal="true" aria-label="Round ${h.round} klibi">
      <div class="thumb" data-map="${harita}" id="oyEkran">
        <div class="sky s${h.round % 3}"></div>
        <div class="kf" aria-hidden="true">${Array.from({ length: kSay }, (_, j) => `<i style="width:${[96, 80, 108, 70, 90][j]}px;height:10px"></i>`).join('')}</div>
        <span class="tb tl">R${h.round} · ${esc(etk.join(' · '))}</span>
        <button class="play" data-act="oyDur" aria-label="Oynat">${ik('oynat', 24)}</button>
      </div>
      <div class="ctl">
        <button class="ibtn bordered" data-act="oyDur" id="oyBtn" aria-label="Oynat">${ik('oynat', 14)}</button>
        <span class="time" id="oySaat">0:00</span>
        <div class="tl"><i id="oyCubuk" style="--sure:${h.saniye || 12}s"></i></div>
        <span class="time">0:${String(h.saniye || 0).padStart(2, '0')}</span>
      </div>
      <div class="player-f">
        <div class="grow"><b>Round ${h.round} · ${esc(etk[0] || 'Highlight')}</b><span class="mono" title="${esc(h.klip)}">${esc(h.klip)}</span></div>
        <button class="btn sm" data-act="klasor">${ik('klasor', 14)}Klasörde göster</button>
        <button class="btn sm" data-act="kapat">Kapat</button>
      </div>
    </div>`;
    o.hidden = false;
    o.dataset.sure = h.saniye || 12;
    o.dataset.gecen = 0;
    o.dataset.oyn = '0';
  }
  function oynatDurdur() {
    const o = $('oynatici');
    const cubuk = $('oyCubuk');
    if (!cubuk) return;
    const oynuyor = o.dataset.oyn === '1';
    const sure = Number(o.dataset.sure);
    if (!oynuyor) {
      if (Number(o.dataset.gecen) >= sure) { o.dataset.gecen = 0; cubuk.classList.remove('go'); void cubuk.offsetWidth; }
      cubuk.classList.add('go'); cubuk.classList.remove('dur');
      o.dataset.oyn = '1';
      $('oyEkran').classList.add('oynuyor');
      $('oyBtn').innerHTML = ik('durdur', 14);
      clearInterval(oynatZaman);
      oynatZaman = setInterval(() => {
        const g = Math.min(sure, Number(o.dataset.gecen) + .25);
        o.dataset.gecen = g;
        const sn = Math.floor(g);
        const saat = $('oySaat'); if (saat) saat.textContent = `0:${String(sn).padStart(2, '0')}`;
        if (g >= sure) { clearInterval(oynatZaman); o.dataset.oyn = '0'; $('oyEkran').classList.remove('oynuyor'); $('oyBtn').innerHTML = ik('oynat', 14); }
      }, 250);
    } else {
      cubuk.classList.add('dur');
      o.dataset.oyn = '0';
      clearInterval(oynatZaman);
      $('oyEkran').classList.remove('oynuyor');
      $('oyBtn').innerHTML = ik('oynat', 14);
    }
  }
  function oynatKapat() { clearInterval(oynatZaman); $('oynatici').hidden = true; $('oynatici').innerHTML = ''; }

  /* =========================================================
     KOMUT ÇUBUĞU
     ========================================================= */
  function komutlar() {
    const l = [];
    D.demolar.forEach((d) => {
      const h = demoHarita(d);
      const s = d.analiz_edildi ? D.demo[d.id] : null;
      const k = s ? skorBilgi(s) : null;
      l.push({ g: 'Demolar', ad: haritaAd(h) || 'Bilinmeyen harita', alt: [k ? `${k.biz}–${k.on}` : 'analiz bekliyor', tarihKisa(d.tarih)].join(' · '),
        ara: `${d.ad} ${h || ''}`, ic: `<span class="mt sm" data-map="${haritaAnahtar(h)}">${esc(harf(h))}</span>`, f: () => demoSec(d.id) });
    });
    const d = demoBul(S.secili);
    l.push({ g: 'Eylemler', ad: 'Demo yükle', alt: '.dem · .zst · .gz · .bz2', ic: ik('yukle', 14), f: () => $('dosya').click() });
    if (d && d.analiz_edildi) {
      l.push({ g: 'Eylemler', ad: `Klipleri kaydet (en iyi ${S.enIyi || 'hepsi'})`, alt: haritaAd(demoHarita(d)), ic: ik('kayit', 14), f: kaydet });
      l.push({ g: 'Git', ad: 'Skor tablosu', ic: ik('tablo', 14), f: () => git('skor') });
      l.push({ g: 'Git', ad: 'Round akışı', ic: ik('akis', 14), f: () => git('roundlar') });
      l.push({ g: 'Git', ad: 'Klipler', ic: ik('film', 14), f: () => git('klipler') });
    } else if (d) {
      l.push({ g: 'Eylemler', ad: 'Demoyu analiz et', alt: d.ad, ic: ik('akis', 14), f: analizEt });
    }
    l.push({ g: 'Sistem', ad: 'Kayıt kontrolünü yenile', ic: ik('kalkan', 14), f: kontrolEt });
    l.push({ g: 'Görünüm', ad: 'Tema: Sistem', ic: ik('sistem', 14), f: () => temaUygula('sistem') });
    l.push({ g: 'Görünüm', ad: 'Tema: Açık', ic: ik('gunes', 14), f: () => temaUygula('acik') });
    l.push({ g: 'Görünüm', ad: 'Tema: Koyu', ic: ik('ay', 14), f: () => temaUygula('koyu') });
    return l;
  }
  function git(id) {
    const el = $(id);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' });
  }
  function cmdkAc() {
    kenarAc(false);
    $('cmdk').hidden = false;
    const inp = $('cmdkIn');
    inp.value = '';
    S.ck = 0;
    cmdkCiz();
    setTimeout(() => inp.focus(), 0);
  }
  function cmdkKapat() { $('cmdk').hidden = true; }
  function cmdkCiz() {
    const q = kucuk($('cmdkIn').value.trim());
    const liste = komutlar().filter((x) => !q || kucuk(`${x.ad} ${x.alt || ''} ${x.ara || ''} ${x.g}`).includes(q));
    S.ckListe = liste;
    S.ck = Math.max(0, Math.min(S.ck, liste.length - 1));
    const L = $('cmdkL');
    if (!liste.length) { L.innerHTML = `<div class="cmdk-none">“${esc($('cmdkIn').value)}” için sonuç yok</div>`; return; }
    let grup = '';
    L.innerHTML = liste.map((x, i) => {
      const bas = x.g !== grup ? `<div class="cmdk-g">${esc(x.g)}</div>` : '';
      grup = x.g;
      return `${bas}<button class="cmdk-i" role="option" data-ck="${i}" aria-selected="${i === S.ck}">
        <span class="ic" style="${x.ic.startsWith('<span') ? 'border:0;background:none' : ''}">${x.ic}</span><span class="t">${esc(x.ad)}</span>${x.alt ? `<span class="sub">${esc(x.alt)}</span>` : ''}</button>`;
    }).join('');
  }
  function cmdkSec(i) {
    const x = S.ckListe[i];
    if (!x) return;
    cmdkKapat();
    x.f();
  }

  /* =========================================================
     YÜKLEME (örnek: dosya okunmaz, ilerleme taklit edilir)
     ========================================================= */
  function dosyalariAl(dosyalar) {
    [...dosyalar].forEach((f) => {
      if (!UZANTI.test(f.name)) { bildir('err', 'Desteklenmeyen dosya', `${f.name} — yalnız .dem, .dem.zst, .dem.gz, .dem.bz2`); return; }
      const y = { ad: f.name, boyut: f.size, oran: 0 };
      S.yuklemeler.push(y);
      yuklemeCiz();
      const z = setInterval(() => {
        y.oran = Math.min(100, y.oran + 5 + Math.random() * 12);
        yuklemeCiz();
        if (y.oran >= 100) {
          clearInterval(z);
          S.yuklemeler = S.yuklemeler.filter((x) => x !== y);
          const id = 'yeni-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          D.demolar.unshift({ id, ad: f.name, harita: null, tarih: new Date().toISOString(), boyut_mb: Math.round(f.size / 1048576 * 10) / 10, analiz_edildi: false, klip_sayisi: 0 });
          kenarCiz();
          bildir('ok', 'Demo yüklendi', f.name);
        }
      }, 140);
    });
  }

  /* =========================================================
     GEZİNME
     ========================================================= */
  function demoSec(id) {
    if (!demoBul(id)) return;
    S.secili = id;
    S.filtre = 'tum';
    try { history.replaceState(null, '', '#' + encodeURIComponent(id)); } catch (e) { /* önizlemede engellenebilir */ }
    kenarCiz();
    anaCiz();
    kenarAc(false);
    window.scrollTo({ top: 0 });
  }
  function kenarAc(ac) {
    $('kenar').classList.toggle('acik', ac);
    $('scrim').classList.toggle('on', ac);
  }

  /* ---------- olaylar ---------- */
  document.addEventListener('click', (e) => {
    const ckBtn = e.target.closest('[data-ck]');
    if (ckBtn) { cmdkSec(Number(ckBtn.dataset.ck)); return; }
    if (e.target === $('cmdk')) { cmdkKapat(); return; }
    if (e.target === $('oynatici')) { oynatKapat(); return; }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    switch (el.dataset.act) {
      case 'demo': demoSec(el.dataset.id); break;
      case 'menu': kenarAc(true); break;
      case 'kapatKenar': kenarAc(false); break;
      case 'cmdk': cmdkAc(); break;
      case 'tema': temaUygula(el.dataset.t); break;
      case 'filtre': S.filtre = el.dataset.f; segBas(el); tablolariCiz(); break;
      case 'sira': {
        const k = el.dataset.k;
        S.sira = S.sira.k === k ? { k, azalan: !S.sira.azalan } : { k, azalan: k !== 'ad' };
        tablolariCiz(); break;
      }
      case 'enIyi': S.enIyi = Number(el.dataset.n); segBas(el); isCiz(); izgaraCiz(); break;
      case 'kaydet': kaydet(); break;
      case 'kontrol': kontrolEt(); break;
      case 'analiz': analizEt(); break;
      case 'oynat': oynatAc(Number(el.dataset.r)); break;
      case 'oyDur': oynatDurdur(); break;
      case 'kapat': oynatKapat(); break;
      case 'klasor': bildir('info', 'Örnek modda kullanılamaz', 'Gerçek arayüzde klip klipler/ klasöründe açılır.'); break;
      case 'yenile':
        el.classList.remove('spin-once'); void el.offsetWidth; el.classList.add('spin-once');
        bildir('info', 'Liste güncel', `${D.demolar.length} demo`); break;
      default: break;
    }
  });
  document.addEventListener('toggle', (e) => { if (e.target.id === 'isLogD') S.logAcik = e.target.open; }, true);

  $('cmdkIn').addEventListener('input', () => { S.ck = 0; cmdkCiz(); });
  $('cmdkL').addEventListener('mousemove', (e) => {
    const b = e.target.closest('[data-ck]');
    if (!b || Number(b.dataset.ck) === S.ck) return;
    S.ck = Number(b.dataset.ck);
    $('cmdkL').querySelectorAll('[data-ck]').forEach((x) => x.setAttribute('aria-selected', String(Number(x.dataset.ck) === S.ck)));
  });

  document.addEventListener('keydown', (e) => {
    const yaziyor = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('cmdk').hidden ? cmdkAc() : cmdkKapat(); return; }
    if (!$('cmdk').hidden) {
      if (e.key === 'Escape') { e.preventDefault(); cmdkKapat(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const n = S.ckListe.length;
        if (!n) return;
        S.ck = (S.ck + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
        cmdkCiz();
        const sel = $('cmdkL').querySelector('[aria-selected="true"]');
        if (sel) sel.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') { e.preventDefault(); cmdkSec(S.ck); }
      return;
    }
    if (!$('oynatici').hidden) {
      if (e.key === 'Escape') oynatKapat();
      if (e.key === ' ' && !yaziyor) { e.preventDefault(); oynatDurdur(); }
      return;
    }
    if (e.key === 'Escape') kenarAc(false);
    if (e.key === '/' && !yaziyor) { e.preventDefault(); cmdkAc(); }
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === $('birak')) { e.preventDefault(); $('dosya').click(); }
  });

  /* sürükle-bırak */
  const birak = $('birak');
  let surukle = 0;
  const dosyaMi = (e) => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  window.addEventListener('dragenter', (e) => { if (!dosyaMi(e)) return; e.preventDefault(); surukle++; $('dropOvl').hidden = false; birak.classList.add('over'); });
  window.addEventListener('dragover', (e) => { if (dosyaMi(e)) e.preventDefault(); });
  window.addEventListener('dragleave', (e) => { if (!dosyaMi(e)) return; surukle = Math.max(0, surukle - 1); if (!surukle) { $('dropOvl').hidden = true; birak.classList.remove('over'); } });
  window.addEventListener('drop', (e) => {
    if (!dosyaMi(e)) return;
    e.preventDefault(); surukle = 0; $('dropOvl').hidden = true; birak.classList.remove('over');
    dosyalariAl(e.dataTransfer.files);
  });
  $('dosya').addEventListener('change', (e) => { dosyalariAl(e.target.files); e.target.value = ''; });

  /* ipucu */
  const tip = $('tip');
  let tipEl = null;
  document.addEventListener('pointerover', (e) => {
    const t = e.target.closest('[data-tip]');
    if (t === tipEl) return;
    tipEl = t;
    if (!t) { tip.classList.remove('on'); return; }
    tip.textContent = t.dataset.tip;
    const r = t.getBoundingClientRect();
    const w = tip.offsetWidth, h = tip.offsetHeight;
    const x = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    let y = r.top - h - 8;
    if (y < 8) y = r.bottom + 8;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
    tip.classList.add('on');
  });
  window.addEventListener('scroll', () => { tip.classList.remove('on'); tipEl = null; }, { passive: true });

  let boyutZaman;
  window.addEventListener('resize', () => { clearTimeout(boyutZaman); boyutZaman = setTimeout(() => tumSegler(true), 80); });

  /* ---------- başlat ---------- */
  simgeleriKoy();
  document.querySelectorAll('.kisayol').forEach((k) => { k.textContent = MAC ? '⌘K' : 'Ctrl K'; });
  let t0 = 'sistem';
  try { t0 = localStorage.getItem('csklip-tema') || 'sistem'; } catch (e) { /* yok say */ }
  temaUygula(t0, true);
  const hash = decodeURIComponent(location.hash.slice(1));
  const ilk = demoBul(hash) ? hash : (D.demolar.find((d) => d.analiz_edildi) || D.demolar[0] || {}).id;
  S.secili = ilk || null;
  kenarCiz();
  anaCiz();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => tumSegler(true));
})();
</script>
</body>
</html>
