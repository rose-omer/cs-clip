<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cs-klip</title>
<meta name="description" content="cs-klip tasarım maketi 09 — Sade Aydınlık: CS2 demo istatistikleri ve highlight klipleri.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script>
  /* tema, ilk boyamadan önce uygulanır (yanıp sönme olmasın) */
  try {
    var t = localStorage.getItem('csklip-tema');
    if (t === 'acik') document.documentElement.dataset.theme = 'light';
    if (t === 'koyu') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
</script>
<style>
/* =========================================================
   cs-klip · 09 Sade Aydınlık
   Tek vurgu: indigo. Durum renkleri (iyi/kötü/uyarı) yalnız anlam taşır.
   ========================================================= */
:root {
  --bg: #fafafa;
  --panel: #ffffff;
  --subtle: #f4f4f5;
  --hover: #f4f4f6;
  --border: #e8e8ec;
  --border-2: #d8d8de;
  --text: #17171c;
  --text-2: #55555f;
  --text-3: #8b8b96;

  --accent: #4f46e5;
  --accent-h: #4338ca;
  --accent-soft: #f0f1ff;
  --accent-line: #d3d6fb;
  --accent-mid: #c3c7f8;
  --accent-ink: #4338ca;

  --good: #16a34a;  --good-soft: #effbf3; --good-ink: #15803d;
  --bad: #e5484d;   --bad-soft: #fdf1f1;  --bad-ink: #c4313a;
  --warn-soft: #fffaeb; --warn-line: #f3dea6; --warn-ink: #8f5506;

  --thumb: #ffffff;
  --tip-bg: #18181b; --tip-fg: #fafafa;
  --scrim: rgba(17, 17, 24, .28);

  --shadow-sm: 0 1px 2px rgba(16, 16, 24, .04);
  --shadow: 0 1px 2px rgba(16, 16, 24, .04), 0 1px 3px -1px rgba(16, 16, 24, .04);
  --shadow-md: 0 1px 2px rgba(16, 16, 24, .04), 0 6px 16px -6px rgba(16, 16, 24, .10);
  --shadow-lg: 0 24px 56px -16px rgba(16, 16, 24, .22), 0 2px 6px rgba(16, 16, 24, .06);

  --font: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0e; --panel: #121216; --subtle: #1a1a20; --hover: #1c1c22;
    --border: #25252c; --border-2: #34343d;
    --text: #ededf0; --text-2: #a3a3ad; --text-3: #6f6f7a;
    --accent: #6366f1; --accent-h: #7376f4; --accent-soft: rgba(99, 102, 241, .12);
    --accent-line: rgba(129, 140, 248, .34); --accent-mid: rgba(129, 140, 248, .38); --accent-ink: #a5b4fc;
    --good: #3fb950; --good-soft: rgba(63, 185, 80, .12); --good-ink: #63d27d;
    --bad: #f2555a; --bad-soft: rgba(242, 85, 90, .12); --bad-ink: #ff8589;
    --warn-soft: rgba(245, 176, 65, .09); --warn-line: rgba(245, 176, 65, .26); --warn-ink: #f0b75a;
    --thumb: #2a2a32; --tip-bg: #ededf0; --tip-fg: #121216; --scrim: rgba(0, 0, 0, .55);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-md: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -8px rgba(0, 0, 0, .5);
    --shadow-lg: 0 24px 56px -12px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .04);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0e; --panel: #121216; --subtle: #1a1a20; --hover: #1c1c22;
  --border: #25252c; --border-2: #34343d;
  --text: #ededf0; --text-2: #a3a3ad; --text-3: #6f6f7a;
  --accent: #6366f1; --accent-h: #7376f4; --accent-soft: rgba(99, 102, 241, .12);
  --accent-line: rgba(129, 140, 248, .34); --accent-mid: rgba(129, 140, 248, .38); --accent-ink: #a5b4fc;
  --good: #3fb950; --good-soft: rgba(63, 185, 80, .12); --good-ink: #63d27d;
  --bad: #f2555a; --bad-soft: rgba(242, 85, 90, .12); --bad-ink: #ff8589;
  --warn-soft: rgba(245, 176, 65, .09); --warn-line: rgba(245, 176, 65, .26); --warn-ink: #f0b75a;
  --thumb: #2a2a32; --tip-bg: #ededf0; --tip-fg: #121216; --scrim: rgba(0, 0, 0, .55);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-md: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 20px -8px rgba(0, 0, 0, .5);
  --shadow-lg: 0 24px 56px -12px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .04);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-line); }
.i { display: block; flex: none; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.muted { color: var(--text-3); }

/* ---------- iskelet ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
.main { min-width: 0; }

/* ---------- kenar çubuğu ---------- */
.side {
  position: sticky; top: 0; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  padding: 14px 12px 12px;
  background: var(--panel); border-right: 1px solid var(--border);
  overflow-y: auto; overscroll-behavior: contain;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.mark {
  width: 22px; height: 22px; border-radius: 6px; background: var(--accent);
  display: grid; place-items: center; flex: none;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), 0 1px 2px rgba(79, 70, 229, .35);
}
.mark::after {
  content: ""; width: 0; height: 0; margin-left: 2px;
  border-left: 7px solid #fff; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent;
}
.brand b { font-size: 15px; font-weight: 600; letter-spacing: -.015em; }
.env {
  margin-left: auto; font-size: 11px; font-weight: 500; color: var(--text-3);
  border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px;
}
.side .close { margin-left: 4px; display: none; }

.search {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 34px;
  padding: 0 6px 0 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text-3); cursor: pointer; text-align: left;
  font-size: 13px; transition: border-color .15s, box-shadow .15s, background .15s;
}
.search:hover { border-color: var(--border-2); box-shadow: var(--shadow-sm); }
.search span { flex: 1; }
kbd {
  font: 500 11px/1.4 var(--mono); color: var(--text-2);
  background: var(--panel); border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 5px; padding: 0 5px; white-space: nowrap;
}

.nav-h {
  display: flex; align-items: center; gap: 6px;
  padding: 18px 8px 6px; font-size: 12px; font-weight: 500; color: var(--text-3);
}
.nav-h .count { font-variant-numeric: tabular-nums; }
.nav-h .ibtn { margin-left: auto; width: 24px; height: 24px; }

.demos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.demo {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 8px; border: 0; border-radius: 8px; background: none;
  text-align: left; cursor: pointer; transition: background .12s, box-shadow .12s;
}
.demo:hover { background: var(--hover); }
.demo.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.demo-g { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.demo-u { display: flex; align-items: center; gap: 8px; }
.demo-u b { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.demo-a { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.demo-a .live { color: var(--accent-ink); }

/* harita kutucuğu */
.mt {
  width: 32px; height: 32px; border-radius: 8px; flex: none;
  display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: rgba(255, 255, 255, .95);
  background: var(--mt); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06), inset 0 1px 0 rgba(255, 255, 255, .18);
  letter-spacing: -.01em; text-shadow: 0 1px 1px rgba(0, 0, 0, .15);
}
.mt.lg { width: 56px; height: 56px; border-radius: 13px; font-size: 21px; }
.mt.sm { width: 24px; height: 24px; border-radius: 6px; font-size: 10.5px; }
[data-map] { --mt: linear-gradient(140deg, #a8a8b3, #6f6f7c); --tint: #7d7f96; }
[data-map="anubis"]  { --mt: linear-gradient(140deg, #cbb57f, #8b7244); --tint: #b8975a; }
[data-map="mirage"]  { --mt: linear-gradient(140deg, #d4a675, #98663b); --tint: #c98a50; }
[data-map="inferno"] { --mt: linear-gradient(140deg, #bf8770, #7a4636); --tint: #b8664c; }
[data-map="dust2"]   { --mt: linear-gradient(140deg, #d9bf8a, #a0804c); --tint: #c7a467; }
[data-map="nuke"]    { --mt: linear-gradient(140deg, #8fa3b5, #55687c); --tint: #6d8aa6; }
[data-map="ancient"] { --mt: linear-gradient(140deg, #8fae8a, #546f50); --tint: #6f9b6a; }
[data-map="vertigo"] { --mt: linear-gradient(140deg, #9aa6c4, #5c6789); --tint: #7b88b0; }
[data-map="overpass"]{ --mt: linear-gradient(140deg, #9db3a2, #5f7866); --tint: #7b9a84; }
[data-map="train"]   { --mt: linear-gradient(140deg, #a59a8c, #675d52); --tint: #8d7f6f; }

.pill {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  font-size: 11.5px; font-weight: 500; line-height: 18px; padding: 0 7px; border-radius: 999px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.pill.g { background: var(--good-soft); color: var(--good-ink); }
.pill.m { background: var(--bad-soft); color: var(--bad-ink); }
.pill.n { background: var(--subtle); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--border); }
.pill.a { background: var(--accent-soft); color: var(--accent-ink); }

/* yükleme alanı */
.side-alt { margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.drop {
  display: block; position: relative; padding: 16px 12px 14px; text-align: center; cursor: pointer;
  border: 1px dashed var(--border-2); border-radius: 10px; background: var(--bg);
  transition: border-color .15s, background .15s, transform .15s;
}
.drop:hover { border-color: var(--text-3); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.01); }
.drop .ic {
  width: 32px; height: 32px; margin: 0 auto 8px; border-radius: 8px; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow-sm); color: var(--text-2);
  transition: color .15s, transform .2s var(--ease);
}
.drop:hover .ic, .drop.over .ic { color: var(--accent); transform: translateY(-1px); }
.drop strong { display: block; font-size: 13px; font-weight: 500; }
.drop span { display: block; font-size: 12px; color: var(--text-3); margin-top: 1px; }
.drop small { display: block; margin-top: 8px; font: 11px var(--mono); color: var(--text-3); }

.ups { display: flex; flex-direction: column; gap: 6px; }
.up { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); animation: gir .25s var(--ease) both; }
.up-u { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.up-u span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.up-u span:last-child { color: var(--text-3); font-variant-numeric: tabular-nums; }
.up .bar { margin: 6px 0 0; height: 4px; }

.status {
  display: flex; align-items: flex-start; gap: 9px; padding: 9px 10px;
  border-radius: 8px; font-size: 12px; color: var(--text-2); border: 1px solid var(--border);
}
.status .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--text-3); }
.status.ok .dot { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.status.warn .dot { background: #d99a1e; box-shadow: 0 0 0 3px var(--warn-soft); }
.status b { display: block; font-weight: 500; color: var(--text); }
.status .lnk { margin-top: 2px; }

.lnk {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--accent-ink); font-size: 12px; font-weight: 500;
}
.lnk:hover { text-decoration: underline; text-underline-offset: 2px; }

/* ---------- üst çubuk ---------- */
.top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 32px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--text-3); }
.crumb .sl { color: var(--border-2); }
.crumb b { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.ibtn {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: none;
  display: grid; place-items: center; color: var(--text-2); cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.ibtn:hover { background: var(--hover); color: var(--text); }
.ibtn.bordered { border-color: var(--border); background: var(--panel); box-shadow: var(--shadow-sm); }
.menu, .ara-m { display: none; }
.ibtn.spin-once .i { animation: don .6s var(--ease); }

/* ---------- segment kontrol ---------- */
.seg {
  position: relative; display: inline-flex; gap: 2px; padding: 2px;
  background: var(--subtle); border: 1px solid var(--border); border-radius: 8px; flex: none;
}
.seg-th {
  position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: 6px;
  background: var(--thumb); box-shadow: 0 1px 2px rgba(16, 16, 24, .08), 0 0 0 1px var(--border);
  transition: left .24s var(--ease), width .24s var(--ease);
}
.seg.ilk .seg-th { transition: none; }
.seg button {
  position: relative; z-index: 1; border: 0; background: none; cursor: pointer;
  height: 26px; padding: 0 10px; border-radius: 6px;
  font-size: 12.5px; font-weight: 500; color: var(--text-3); white-space: nowrap;
  transition: color .15s;
}
.seg button:hover { color: var(--text-2); }
.seg button[aria-pressed="true"] { color: var(--text); }
.seg.icon button { padding: 0 7px; display: grid; place-items: center; }

/* ---------- içerik ---------- */
.content { max-width: 1180px; margin: 0 auto; padding: 28px 32px 72px; display: flex; flex-direction: column; gap: 16px; }
.sec { animation: gir .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms); }
@keyframes gir { from { opacity: 0; transform: translateY(6px); } }
@keyframes don { to { transform: rotate(360deg); } }
@keyframes dolu { from { width: 0; } }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.card-h {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 16px;
  padding: 16px 20px 0;
}
.card-h.line { padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.card-h h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.005em; line-height: 1.4; }
.card-h p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-3); }
.card-b { padding: 16px 20px 20px; }
.acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sec-t { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 2px -4px; }
.sec-t h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--text-2); }
.sec-t span { font-size: 12px; color: var(--text-3); }

/* ---------- düğmeler ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text);
  font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-sm);
  transition: background .15s, border-color .15s, box-shadow .15s, transform .06s, opacity .15s;
}
.btn:hover { background: var(--hover); border-color: var(--border-2); }
.btn:active { transform: translateY(.5px); }
.btn.pri {
  background: var(--accent); color: #fff; border-color: transparent;
  box-shadow: 0 1px 2px rgba(79, 70, 229, .28), inset 0 1px 0 rgba(255, 255, 255, .14);
}
.btn.pri:hover { background: var(--accent-h); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn .n { font-weight: 400; opacity: .78; }

/* ---------- maç başlığı ---------- */
.match { overflow: hidden; }
.match-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 24px; padding: 20px 24px; }
.match-l { display: flex; align-items: center; gap: 16px; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 500; color: var(--text-3); display: flex; align-items: center; gap: 8px; }
.match h1 { margin: 2px 0 4px; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -.022em; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12.5px; color: var(--text-2); }
.meta span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.meta .i { color: var(--text-3); }

.scoreline { display: flex; align-items: center; gap: 20px; }
.tm { display: flex; flex-direction: column; gap: 2px; font-size: 13px; font-weight: 500; }
.tm small { font-size: 11.5px; font-weight: 400; color: var(--text-3); }
.tm.r { text-align: left; }
.tm.l { text-align: right; }
.bigscore { display: flex; align-items: center; gap: 10px; font-size: 38px; font-weight: 600; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.bigscore .lo { color: var(--text-3); }
.bigscore .sep { font-size: 22px; color: var(--border-2); font-weight: 400; transform: translateY(-2px); }
.result { justify-self: end; }

.match-f {
  display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap;
  padding: 12px 24px; background: var(--bg); border-top: 1px solid var(--border);
  font-size: 12.5px; color: var(--text-2);
}
.match-f b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.strip { flex: 1; min-width: 160px; display: flex; gap: 2px; height: 14px; align-items: stretch; }
.strip i { flex: 1; border-radius: 2px; background: var(--border); transition: transform .15s; }
.strip i.w { background: var(--accent); }
.strip i.gap { flex: 0 0 6px; background: none; }
.strip i:hover { transform: scaleY(1.25); }

/* ---------- kutucuklar ---------- */
.tiles { display: grid; grid-template-columns: minmax(0, 1.22fr) repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { padding: 16px; display: flex; flex-direction: column; gap: 4px; transition: border-color .18s, box-shadow .18s; }
.tile:hover { border-color: var(--border-2); box-shadow: var(--shadow-md); }
.tile-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.tile-h [data-tip] { cursor: help; text-decoration: underline dotted var(--border-2); text-underline-offset: 3px; }
.rank { font-size: 11.5px; font-weight: 400; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile-v { font-size: 26px; font-weight: 600; letter-spacing: -.025em; line-height: 1.2; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile-v small { font-size: 15px; font-weight: 500; color: var(--text-3); letter-spacing: 0; margin-left: 1px; }
.tile-f { font-size: 12px; color: var(--text-3); margin-top: auto; padding-top: 2px; }
.delta { font-weight: 500; font-variant-numeric: tabular-nums; }
.delta.pos { color: var(--good-ink); }
.delta.neg { color: var(--bad-ink); }

.range { position: relative; height: 4px; border-radius: 99px; background: var(--subtle); margin: 8px 0 6px; box-shadow: inset 0 0 0 1px var(--border); }
.range-fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: inherit; background: var(--accent); animation: dolu .8s var(--ease) both; }
.range-avg { position: absolute; top: -3px; width: 2px; height: 10px; margin-left: -1px; border-radius: 2px; background: var(--text-2); }

.tile.rating { grid-row: span 2; }
.gauge { position: relative; width: 100%; max-width: 230px; margin: 10px auto 0; }
.gauge svg { display: block; width: 100%; height: auto; overflow: visible; }
.gauge .trk { stroke: var(--subtle); }
.gauge .val { stroke: var(--accent); animation: yay 1s var(--ease) both; }
.gauge .tick { stroke: var(--text-3); }
.gauge text { fill: var(--text-3); font: 500 10px var(--font); }
@keyframes yay { from { stroke-dashoffset: 100; } }
.gauge-c { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; }
.gauge-c b { display: block; font-size: 38px; font-weight: 600; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.gauge-c .pill { margin-top: 8px; }
.r-sub { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
.r-sub div { text-align: center; font-size: 11.5px; color: var(--text-3); }
.r-sub div + div { border-left: 1px solid var(--border); }
.r-sub b { display: block; font-size: 14px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

.split { display: flex; gap: 2px; height: 6px; margin: 9px 0 6px; border-radius: 99px; overflow: hidden; }
.split i { background: var(--good); animation: dolu .8s var(--ease) both; }
.split i.d { background: var(--bad); opacity: .85; }
.split i.e { background: var(--subtle); flex: 1; }

.mk { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.mk div { border: 1px solid var(--border); border-radius: 8px; padding: 6px 0 5px; text-align: center; transition: background .15s; }
.mk b { display: block; font-size: 17px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
.mk span { font-size: 11px; color: var(--text-3); font-weight: 500; }
.mk .z { opacity: .5; }
.mk .on { background: var(--accent-soft); border-color: var(--accent-line); }
.mk .on b { color: var(--accent-ink); }

/* ---------- skor tablosu ---------- */
.team + .team { border-top: 1px solid var(--border); }
.team-h { display: flex; align-items: center; gap: 10px; padding: 16px 20px 8px; font-size: 13px; }
.team-h b { font-weight: 600; }
.team-h .ts { margin-left: auto; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.tw { overflow-x: auto; }
table.sb { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.sb th { padding: 6px 10px; text-align: right; font-size: 11.5px; font-weight: 500; color: var(--text-3); white-space: nowrap; }
.sb th button {
  border: 0; background: none; padding: 2px 0; cursor: pointer; color: inherit; font: inherit;
  display: inline-flex; align-items: center; gap: 3px; transition: color .15s;
}
.sb th button:hover { color: var(--text); }
.sb th.on button { color: var(--text); }
.sb th .ar { width: 10px; height: 10px; }
.sb td { padding: 8px 10px; text-align: right; border-top: 1px solid var(--border); white-space: nowrap; }
.sb th:first-child, .sb td:first-child { text-align: left; padding-left: 20px; }
.sb th:last-child, .sb td:last-child { padding-right: 20px; }
.sb tbody tr { transition: background .12s; }
.sb tbody tr:hover { background: var(--hover); }
.sb tr.me { background: var(--accent-soft); }
.sb tr.me td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.pl { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pl span.n { overflow: hidden; text-overflow: ellipsis; max-width: 180px; font-weight: 500; }
.av {
  width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-size: 10.5px; font-weight: 600; background: var(--subtle); color: var(--text-2); border: 1px solid var(--border);
}
.me .av { background: var(--accent); color: #fff; border-color: transparent; }
.you { font-size: 10.5px; font-weight: 600; color: var(--accent-ink); border: 1px solid var(--accent-line); background: var(--panel); border-radius: 4px; padding: 0 5px; line-height: 16px; }
.rt { display: inline-block; min-width: 46px; text-align: center; padding: 2px 6px; border-radius: 6px; font-weight: 600; font-size: 12.5px; }
.rt.iyi { background: var(--good-soft); color: var(--good-ink); }
.rt.orta { background: var(--subtle); color: var(--text-2); }
.rt.kotu { background: var(--bad-soft); color: var(--bad-ink); }
.c-iyi { color: var(--good-ink); }
.c-kotu { color: var(--bad-ink); }
.dim { color: var(--text-3); }

/* ---------- roundlar ---------- */
.duo { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; }
.rsum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.rsum div { font-size: 12px; color: var(--text-3); }
.rsum b { display: block; font-size: 18px; font-weight: 600; color: var(--text); letter-spacing: -.015em; font-variant-numeric: tabular-nums; }
.rsum b small { font-size: 12px; color: var(--text-3); font-weight: 500; }
.half { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 12px; align-items: start; }
.half + .half { margin-top: 12px; }
.half-l { font-size: 11.5px; color: var(--text-3); padding-top: 6px; line-height: 1.3; }
.half-l b { display: block; font-size: 13px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.rgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.r { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.rc {
  width: 100%; height: 34px; border-radius: 6px; display: grid; place-items: center;
  font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: default;
  transition: transform .18s var(--ease), box-shadow .18s;
}
.rc.w { background: var(--accent); color: #fff; }
.rc.l { background: var(--subtle); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--border); }
.rc:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.rc.l:hover { box-shadow: inset 0 0 0 1px var(--border-2), var(--shadow-md); }
.rd { width: 50%; height: 3px; border-radius: 2px; background: transparent; }
.rd.on { background: var(--bad); }
.rn { font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; line-height: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 18px; font-size: 12px; color: var(--text-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.w { background: var(--accent); }
.legend i.l { background: var(--subtle); box-shadow: inset 0 0 0 1px var(--border-2); }
.legend i.d { width: 10px; height: 3px; border-radius: 2px; background: var(--bad); }

/* ---------- silahlar ---------- */
.wl { display: flex; flex-direction: column; gap: 14px; }
.wr { display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px; align-items: center; gap: 12px; font-size: 13px; }
.wr .wa { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wb { display: flex; height: 8px; border-radius: 99px; background: var(--subtle); overflow: hidden; }
.wb i { height: 100%; animation: dolu .8s var(--ease) both; }
.wb i.hs { background: var(--accent); }
.wb i.ot { background: var(--accent-mid); }
.wn { text-align: right; font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wn b { color: var(--text); font-weight: 600; }

/* ---------- klipler ---------- */
.callout {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; margin-bottom: 16px;
  border: 1px solid var(--border); border-radius: 9px; font-size: 13px; color: var(--text-2); background: var(--bg);
}
.callout .i { margin-top: 2px; }
.callout .grow { flex: 1; min-width: 0; }
.callout b { font-weight: 500; color: inherit; }
.callout p { margin: 1px 0 0; font-size: 12.5px; opacity: .9; }
.callout.warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn-ink); }
.callout.ok .i { color: var(--good); }
.callout .btn { margin-left: auto; flex: none; }
.callout.shake { animation: titre .4s; }
@keyframes titre { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }

.job {
  margin-bottom: 16px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
  animation: gir .3s var(--ease) both;
}
.job-h { display: flex; align-items: center; gap: 10px; font-size: 13px; min-width: 0; }
.job-h b { font-weight: 600; white-space: nowrap; }
.job-h .msg { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.job-h .pct { margin-left: auto; color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.job-h .ok { color: var(--good); }
.bar { height: 6px; border-radius: 99px; background: var(--subtle); overflow: hidden; margin: 12px 0; box-shadow: inset 0 0 0 1px var(--border); }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .5s var(--ease); }
.job.run .bar i {
  background-image: linear-gradient(90deg, transparent 0, rgba(255, 255, 255, .35) 50%, transparent 100%);
  background-size: 200% 100%; background-repeat: no-repeat; animation: parilti 1.4s linear infinite;
}
.job.done .bar i { background: var(--good); }
@keyframes parilti { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.steps li {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 3px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--panel); font-size: 12px; color: var(--text-3);
  transition: color .2s, border-color .2s;
}
.steps li .s { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--subtle); font-size: 10px; font-weight: 600; }
.steps li.done { color: var(--text-2); }
.steps li.done .s { background: var(--accent); color: #fff; }
.steps li.cur { color: var(--text); border-color: var(--accent-line); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-line); border-top-color: var(--accent); animation: don .8s linear infinite; flex: none; }
.steps li.cur .s { background: none; }
.steps li.cur .spin { width: 14px; height: 14px; }
.spin.xs { width: 10px; height: 10px; border-width: 1.5px; }
details.log { margin-top: 12px; }
details.log summary {
  list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 500; color: var(--text-2);
}
details.log summary::-webkit-details-marker { display: none; }
details.log summary .i { transition: transform .2s var(--ease); }
details.log[open] summary .i { transform: rotate(90deg); }
details.log pre {
  margin: 8px 0 0; padding: 10px 12px; max-height: 170px; overflow: auto;
  font: 12px/1.65 var(--mono); color: var(--text-2); white-space: pre-wrap; word-break: break-word;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
}

.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
.clip {
  display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  transition: transform .22s var(--ease), box-shadow .22s, border-color .22s;
}
.clip:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-2); }
.clip.hedef { border-color: var(--accent-line); }
.clip.yeni { animation: yeni 1.4s var(--ease); }
@keyframes yeni { 0% { box-shadow: 0 0 0 4px var(--accent-line); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* CSS ile çizilmiş küçük resim */
.thumb {
  position: relative; aspect-ratio: 16 / 9; overflow: hidden; isolation: isolate;
  background:
    radial-gradient(90% 70% at 70% 0%, color-mix(in srgb, var(--tint) 55%, transparent), transparent 70%),
    linear-gradient(180deg, color-mix(in srgb, var(--tint) 42%, #1a1c28) 0%, #141520 52%, #0c0d13 100%);
}
.thumb::before {
  content: ""; position: absolute; left: -60%; right: -60%; bottom: -12%; height: 62%; z-index: -1;
  background-image: linear-gradient(rgba(255, 255, 255, .10) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .10) 1px, transparent 1px);
  background-size: 26px 26px; transform: perspective(150px) rotateX(58deg); transform-origin: bottom;
  -webkit-mask-image: linear-gradient(to top, #000 15%, transparent 95%); mask-image: linear-gradient(to top, #000 15%, transparent 95%);
}
.thumb::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, .45)); pointer-events: none; }
.sky { position: absolute; left: 0; right: 0; top: 24%; height: 30%; z-index: -1; background: rgba(6, 7, 12, .42); }
.sky.s0 { clip-path: polygon(0 100%, 0 46%, 10% 46%, 10% 22%, 21% 22%, 21% 58%, 33% 58%, 33% 8%, 41% 8%, 41% 62%, 56% 62%, 56% 30%, 69% 30%, 69% 52%, 80% 52%, 80% 16%, 89% 16%, 89% 44%, 100% 44%, 100% 100%); }
.sky.s1 { clip-path: polygon(0 100%, 0 30%, 14% 30%, 14% 60%, 26% 60%, 26% 18%, 38% 18%, 38% 40%, 50% 40%, 50% 4%, 57% 4%, 57% 48%, 72% 48%, 72% 26%, 86% 26%, 86% 64%, 100% 64%, 100% 100%); }
.sky.s2 { clip-path: polygon(0 100%, 0 60%, 8% 60%, 8% 34%, 24% 34%, 24% 12%, 30% 12%, 30% 50%, 46% 50%, 46% 24%, 62% 24%, 62% 56%, 74% 56%, 74% 10%, 84% 10%, 84% 38%, 100% 38%, 100% 100%); }
.kf { position: absolute; top: 9px; right: 9px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.kf i { display: block; height: 7px; border-radius: 2px; background: rgba(8, 8, 12, .55); box-shadow: inset 0 0 0 1px rgba(232, 72, 72, .85); }
.tb {
  position: absolute; display: inline-flex; align-items: center; gap: 5px; padding: 0 6px; height: 20px; border-radius: 5px;
  font: 500 11px/20px var(--mono); color: #fff; background: rgba(10, 10, 16, .58);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
}
.tb.tl { top: 9px; left: 9px; }
.tb.bl { bottom: 9px; left: 9px; }
.tb.br { bottom: 9px; right: 9px; }
.tb.mid { left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--font); height: 26px; padding: 0 10px; color: rgba(255, 255, 255, .85); }
.clip.yok .thumb { filter: saturate(.35) brightness(.86); }
.play {
  position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
  border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: rgba(255, 255, 255, .94); color: #121218;
  box-shadow: 0 6px 22px rgba(0, 0, 0, .38), 0 0 0 6px rgba(255, 255, 255, .12);
  transition: transform .22s var(--ease), box-shadow .22s;
}
.play .i { margin-left: 2px; }
.clip:hover .play { transform: scale(1.08); box-shadow: 0 8px 26px rgba(0, 0, 0, .45), 0 0 0 8px rgba(255, 255, 255, .14); }
.clip-b { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.clip-t { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.clip-t b { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; flex: none; cursor: help; }
.meter { width: 30px; height: 4px; border-radius: 99px; background: var(--subtle); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 20px; }
.chip { font-size: 11.5px; font-weight: 500; line-height: 18px; padding: 0 7px; border-radius: 5px; border: 1px solid var(--border); color: var(--text-2); background: var(--panel); white-space: nowrap; }
.chip.a { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
.clip-m { display: flex; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-3); }
.clip-m span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.clip-m .st { display: inline-flex; align-items: center; gap: 5px; flex: none; }
.clip-m .st.ok { color: var(--good-ink); }
.clip-m .st.q { color: var(--accent-ink); }

/* ---------- boş / analiz durumu ---------- */
.empty { padding: 48px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.empty-ic { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); box-shadow: var(--shadow-sm); margin-bottom: 16px; }
.empty h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.empty p { margin: 6px 0 0; max-width: 420px; font-size: 13px; color: var(--text-2); }
.file { display: inline-flex; align-items: center; gap: 10px; margin: 18px 0; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 12px; color: var(--text-3); max-width: 100%; }
.file .mono { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.empty .bar { width: min(320px, 100%); margin: 0 0 8px; }
.empty .msg { font-size: 12.5px; color: var(--text-3); margin: 0 0 16px; min-height: 19px; }
.empty .callout { text-align: left; max-width: 460px; }

/* ---------- katmanlar: komut çubuğu, oynatıcı, ipucu, bildirim ---------- */
.ovl {
  position: fixed; inset: 0; z-index: 100; display: flex; justify-content: center; align-items: flex-start;
  padding: 12vh 16px 16px; background: var(--scrim); animation: sol .15s ease both;
}
.ovl.mid { align-items: center; padding-top: 16px; }
@keyframes sol { from { opacity: 0; } }
.cmdk {
  width: 100%; max-width: 580px; overflow: hidden;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg);
  animation: pop .2s var(--ease) both;
}
@keyframes pop { from { opacity: 0; transform: scale(.98) translateY(-6px); } }
.cmdk-in { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-bottom: 1px solid var(--border); color: var(--text-3); }
.cmdk-in input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 15px; color: var(--text); }
.cmdk-in input::placeholder { color: var(--text-3); }
.cmdk-l { max-height: min(380px, 56vh); overflow-y: auto; padding: 6px; }
.cmdk-g { padding: 8px 10px 4px; font-size: 11.5px; font-weight: 500; color: var(--text-3); }
.cmdk-i {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px;
  background: none; text-align: left; cursor: pointer; font-size: 13.5px; color: var(--text);
}
.cmdk-i .ic { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--border); background: var(--bg); color: var(--text-2); flex: none; }
.cmdk-i .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-i .sub { margin-left: auto; padding-left: 8px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.cmdk-i[aria-selected="true"] { background: var(--hover); }
.cmdk-i[aria-selected="true"] .ic { color: var(--accent); border-color: var(--accent-line); }
.cmdk-none { padding: 28px 12px; text-align: center; font-size: 13px; color: var(--text-3); }
.cmdk-f { display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--border); background: var(--bg); font-size: 11.5px; color: var(--text-3); }
.cmdk-f span { display: inline-flex; align-items: center; gap: 5px; }

.player { width: 100%; max-width: 860px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-lg); animation: pop .22s var(--ease) both; }
.player .thumb { aspect-ratio: 16 / 9; }
.player .thumb .play { width: 60px; height: 60px; margin: -30px 0 0 -30px; }
.player .thumb.oynuyor .play { opacity: 0; transform: scale(.9); }
.ctl { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
.ctl .tl { flex: 1; height: 4px; border-radius: 99px; background: var(--subtle); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
.ctl .tl i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
.ctl .tl i.go { animation: ilerle var(--sure, 12s) linear forwards; }
.ctl .tl i.go.dur { animation-play-state: paused; }
@keyframes ilerle { to { transform: scaleX(1); } }
.ctl .time { font: 500 12px var(--mono); color: var(--text-3); white-space: nowrap; }
.player-f { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-top: 1px solid var(--border); background: var(--bg); }
.player-f .grow { flex: 1; min-width: 0; }
.player-f b { display: block; font-size: 14px; font-weight: 600; }
.player-f .mono { display: block; font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tip {
  position: fixed; z-index: 130; left: 0; top: 0; pointer-events: none; max-width: 240px;
  padding: 6px 9px; border-radius: 7px; font-size: 12px; line-height: 1.45; white-space: pre-line;
  background: var(--tip-bg); color: var(--tip-fg); box-shadow: var(--shadow-lg);
  opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s;
}
.tip.on { opacity: 1; transform: none; }

.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 120; display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg);
  font-size: 13px; animation: tin .28s var(--ease) both;
}
.toast .i { margin-top: 1px; }
.toast.ok .i { color: var(--good); }
.toast.err .i { color: var(--bad); }
.toast.info .i { color: var(--accent); }
.toast b { display: block; font-weight: 500; }
.toast span { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 1px; }
.toast.out { animation: tout .2s ease forwards; }
@keyframes tin { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes tout { to { opacity: 0; transform: translateY(4px); } }

.dropovl {
  position: fixed; inset: 0; z-index: 110; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  animation: sol .15s both; pointer-events: none;
}
.dropovl div {
  width: min(440px, 100%); padding: 40px 24px; text-align: center; border-radius: 16px;
  border: 1.5px dashed var(--accent); background: var(--panel); box-shadow: var(--shadow-lg);
}
.dropovl .ic { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.dropovl b { display: block; font-size: 15px; font-weight: 600; }
.dropovl span { font-size: 13px; color: var(--text-2); }

.scrim { display: none; }

/* ---------- duyarlı ---------- */
@media (max-width: 1080px) {

  .tile.rating { grid-row: auto; grid-column: 1 / -1; }
  .tile.rating .rating-in { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 24px; align-items: center; }
  .tile.rating .gauge { margin: 6px 0 0; }
  .tile.rating .r-sub { margin-top: 0; border-top: 0; padding-top: 0; }
  .duo { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 960px) {

  .side {

  .top { padding: 0 16px; gap: 8px; }

  .match-f { padding: 12px 18px; }
  .rsum { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
