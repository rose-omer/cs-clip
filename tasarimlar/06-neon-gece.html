        <div class="kayit-arac">
          <span class="secim-ad" id="secimAd">Kaydedilecek</span>
          <div class="secim" role="group" aria-labelledby="secimAd" id="enIyiSecim">
            <button type="button" data-n="3">En iyi 3</button><button type="button" data-n="5">En iyi 5</button><button type="button" data-n="0">Hepsi</button>
          </div>
          <button type="button" class="dugme" id="kaydetDugme"></button>
        </div>
        <div id="kayitUyari"></div>
        <div id="kayitAlan"></div>
        <div class="klip-izgara" id="klipIzgara"></div>
      </section>`;
    tablolariCiz();
    kayitUyariCiz();
    klipleriCiz(true);
    sayaclariBaslat();
    $('tablolar').onclick = (e) => {
      const th = e.target.closest('th[data-k]');
      if (!th) return;
      const k = th.dataset.k;
      S.sira = S.sira.k === k ? { k, azalan: !S.sira.azalan } : { k, azalan: k !== 'ad' };
      tablolariCiz();
    };
    $('tablolar').onkeydown = (e) => {
      const th = e.target.closest('th[data-k]');
      if (th && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); th.click(); }
    };
    $('enIyiSecim').onclick = (e) => {
      const b = e.target.closest('button[data-n]');
      if (!b || b.disabled) return;
      S.enIyi = Number(b.dataset.n);
      aracGuncelle();
    };
    $('kaydetDugme').onclick = kaydet;
  }

  function macBaslik(s, demo, biz) {
    const t = s.takimlar || [];
    const bizT = t[biz] || { ad: 'Takımın', skor: 0 }, onlarT = t[1 - biz] || { ad: 'Rakip', skor: 0 };
    const sonuc = bizT.skor > onlarT.skor ? etk('Galibiyet', 'dolu-cam') : bizT.skor < onlarT.skor ? etk('Mağlubiyet', 'dolu-mac') : etk('Berabere', 'orta');
    const ad = (haritaAd(s.harita) || 'Bilinmeyen').toUpperCase();
    const toplam = bizT.skor + onlarT.skor;
    const oran = Array.from({ length: toplam }, (_, i) => `<span class="${i < bizT.skor ? 'b' : 'o'}"></span>`).join('');
    return `<section class="panel neon-kenar mac bolum" style="--i:0">
      ${sahneHtml(s.harita)}
      <div class="mac-sol">
        <div class="ust-yazi">Maç özeti // ${esc(s.harita || '?')}</div>
        <h1 class="mac-harita glitch" data-text="${esc(ad)}">${esc(ad)}</h1>
        <div class="mac-meta">
          <span>${s.round_sayisi ?? (s.roundlar || []).length} round</span>
          ${demo ? `<span>${esc(tarihYaz(demo.tarih))}</span><span>${sayi(demo.boyut_mb, 1)} MB</span>` : ''}
        </div>
      </div>
      <div class="mac-sag">
        <div class="skor-blok">
          <div class="skor-takim">${esc(bizT.ad)}<small>senin takımın</small></div>
          <div class="skor" aria-label="Skor ${bizT.skor} – ${onlarT.skor}"><span class="biz">${bizT.skor}</span><span class="ayir">:</span><span class="onlar">${onlarT.skor}</span></div>
          <div class="skor-takim sag">${esc(onlarT.ad)}<small>rakip</small></div>
        </div>
        <div class="mac-sonuc">${sonuc}</div>
      </div>
      <div class="oran" aria-hidden="true">${oran}</div>
    </section>`;
  }

  function benimBolum(o, s) {
    const hepsi = s.oyuncular || [];
    const sira = (k) => 1 + hepsi.filter((x) => (x[k] ?? -1) > (o[k] ?? -1)).length;
    const rs = ratingSinif(o.rating);
    const fark = o.kill - o.death;
    const ck = o.cok_kill || {};
    const akK = o.acilis_kill ?? 0, akO = o.acilis_death ?? 0;
    const akT = akK + akO;
    const akSinif = akK > akO ? 'iyi' : akK < akO ? 'kotu' : '';
    const yuzde = (v, ust) => Math.max(0, Math.min(100, (v / ust) * 100));
    const rKonum = Math.max(0, Math.min(100, ((o.rating - 0.4) / 1.4) * 100));
    const renk = { iyi: 'var(--iyi)', orta: 'var(--orta)', kotu: 'var(--kotu)' }[rs];
    const kutu = (ad, degerHtml, alt, sinif, olcer) => `<div class="kutu ${sinif}">
        <div class="kutu-ad">${ad}</div>
        <div class="kutu-deger">${degerHtml}</div>
        ${alt ? `<div class="kutu-alt">${alt}</div>` : ''}
        ${olcer != null ? `<div class="olcer"><i style="width:${olcer}%"></i></div>` : ''}
      </div>`;
    const say = (v, o2, son = '') => `<span data-say="${v}" data-ondalik="${o2}">${sayi(v, o2)}</span>${son}`;
    const ckHtml = [['2', '2K'], ['3', '3K'], ['4', '4K'], ['5', 'ACE']].map(([k, a]) =>
      `<span class="${ck[k] ? 'var' : ''}">${a}<b>${ck[k] || 0}</b></span>`).join('');
    const rozetler = [];
    if (sira('rating') === 1) rozetler.push(etk('Maçın en iyisi', 'mac'));
    if ((ck['4'] || 0) + (ck['5'] || 0) > 0) rozetler.push(etk(ck['5'] ? 'ACE' : '4K', 'cam'));
    if (o.kast >= 75) rozetler.push(etk('Yüksek KAST', 'iyi'));
    if (fark > 0) rozetler.push(etk(`+${fark} K/D farkı`, ''));
    return `<section class="panel bolum" style="--i:1">
      <div class="ben-ust">
        <header class="bolum-baslik"><h2><i>02</i>Benim istatistiklerim</h2></header>
        <div class="ben-ad">${esc(o.ad)}<small>${esc(o.steamid)}</small></div>
        <div class="etkiler">${rozetler.join('')}</div>
      </div>
      <div class="kutular">
        <div class="kutu rating neon-kenar" style="--renk:${renk}">
          <div class="rating-ust">
            <div class="kutu-ad">Rating <span class="kucuk renk-${rs}">${RATING_AD[rs]}</span></div>
            <div class="rating-deger">${say(o.rating, 2)}</div>
            <div class="kutu-alt">Lobide <b>${sira('rating')}.</b> / ${hepsi.length}</div>
          </div>
          <div class="rating-olcek" aria-hidden="true">
            <div class="rating-iz"></div>
            <div class="rating-isaret"><i style="left:${rKonum}%"></i></div>
            <div class="rating-etiket"><span style="left:0">0,40</span><span style="left:35.7%">0,90</span><span style="left:50%">1,10</span><span style="left:100%">1,80</span></div>
          </div>
        </div>
        ${kutu('ADR', say(o.adr, 1), `Lobide <b>${sira('adr')}.</b> / ${hepsi.length}`, esik(o.adr, 85, 65), yuzde(o.adr, 150))}
        ${kutu('KAST', say(o.kast, 1, '<small>%</small>'), `Lobide <b>${sira('kast')}.</b> / ${hepsi.length}`, esik(o.kast, 75, 65), yuzde(o.kast, 100))}
        ${kutu('K/D', say(o.kd, 2), `<b>${o.kill}</b> / <b>${o.death}</b> / <b>${o.assist}</b> K/Ö/A · <span class="${fark > 0 ? 'renk-iyi' : fark < 0 ? 'renk-kotu' : ''}">${fark > 0 ? '+' : ''}${fark}</span>`, esik(o.kd, 1.1, 0.9), yuzde(o.kd, 2))}
        ${kutu('HS %', say(o.hs_yuzde, 1, '<small>%</small>'), `Lobide <b>${sira('hs_yuzde')}.</b> / ${hepsi.length}`, esik(o.hs_yuzde, 50, 30), yuzde(o.hs_yuzde, 100))}
        <div class="kutu ${akSinif}">
          <div class="kutu-ad">Açılış düelloları</div>
          <div class="kutu-deger">${akK}<small> / </small>${akO}</div>
          <div class="kutu-alt">kazanılan / kaybedilen${akT ? ` · <b>%${sayi(akK / akT * 100, 0)}</b>` : ''}</div>
          <div class="duello" aria-hidden="true">${akT ? `<i class="k" style="flex:${akK}"></i><i class="o" style="flex:${akO}"></i>` : '<i style="flex:1;background:var(--cizgi)"></i>'}</div>
        </div>
        <div class="kutu">
          <div class="kutu-ad">Çoklu kill</div>
          <div class="cok-kill">${ckHtml}</div>
        </div>
      </div>
    </section>`;
  }

  function sayaclariBaslat() {
    const el = [...document.querySelectorAll('[data-say]')];
    if (azHareket()) return;
    const bas = performance.now(), sure = 850;
    el.forEach((e) => { e.textContent = sayi(0, Number(e.dataset.ondalik)); });
    const adim = (t) => {
      const o = Math.min((t - bas) / sure, 1);
      const k = 1 - Math.pow(1 - o, 3);
      el.forEach((e) => { e.textContent = sayi(Number(e.dataset.say) * k, Number(e.dataset.ondalik)); });
      if (o < 1) requestAnimationFrame(adim);
    };
    requestAnimationFrame(adim);
  }

  const SUTUN = [
    ['ad', 'Oyuncu', ''], ['kill', 'K', 'k-ayri'], ['death', 'D', 'k-ayri'], ['assist', 'A', 'k-ayri'],
    ['kd', 'K/D/A', 'k-birlesik'], ['adr', 'ADR', ''], ['hs_yuzde', 'HS%', 'hs-sut'], ['kast', 'KAST', ''], ['rating', 'Rating', ''],
  ];
  function tablolariCiz() {
    const s = VERI.demo[S.secili];
    const ben = benBul(s);
    const biz = s.benim_takim ?? (ben ? ben.takim : 0);
    const { k: anahtar, azalan } = S.sira;
    const sirala = (a, b) => {
      const x = a[anahtar], y = b[anahtar];
      const c = anahtar === 'ad' ? String(x).localeCompare(String(y), 'tr') : (x ?? -1) - (y ?? -1);
      return azalan ? -c : c;
    };
    const renk = (d, iyi, kotu) => { const e = esik(d, iyi, kotu); return e ? 'renk-' + e : ''; };
    $('tablolar').innerHTML = [biz, 1 - biz].map((t) => {
      const takim = (s.takimlar || [])[t] || { ad: `Takım ${t + 1}`, skor: '' };
      const oy = (s.oyuncular || []).filter((o) => o.takim === t).sort(sirala);
      const ort = oy.length ? oy.reduce((a, o) => a + (o.rating || 0), 0) / oy.length : null;
      return `<div>
        <div class="takim-ust">
          <span class="takim-skor ${takim.kazandi ? 'k' : 'm'}"><span>${esc(takim.skor)}</span></span>
          <span class="takim-ad">${esc(takim.ad)}</span>
          ${t === biz ? etk('Senin takımın', 'cam') : etk('Rakip', '')}
          <span class="ort">Ort. rating <b>${sayi(ort, 2)}</b></span>
        </div>
        <div class="tablo-sar"><table>
          <thead><tr>${SUTUN.map(([k, ad, sinif]) =>
            `<th data-k="${k}" tabindex="0" scope="col" class="${sinif} ${k === anahtar ? 'sirali' + (azalan ? '' : ' artan') : ''}" aria-sort="${k === anahtar ? (azalan ? 'descending' : 'ascending') : 'none'}">${ad}</th>`).join('')}</tr></thead>
          <tbody>${oy.map((o) => `<tr class="${o.ben ? 'ben' : ''}">
            <td><span class="oyuncu-hucre" title="${esc(o.steamid)}"><span class="ad">${esc(o.ad)}</span>${o.ben ? '<span class="sen">SEN</span>' : ''}</span></td>
            <td class="k-ayri">${o.kill}</td><td class="k-ayri">${o.death}</td><td class="k-ayri">${o.assist}</td>
            <td class="k-birlesik">${o.kill}<span class="kda-ayir">/</span>${o.death}<span class="kda-ayir">/</span>${o.assist}</td>
            <td class="${renk(o.adr, 85, 65)}">${sayi(o.adr, 1)}</td>
            <td class="hs-sut">${sayi(o.hs_yuzde, 0)}%</td>
            <td class="${renk(o.kast, 75, 65)}">${sayi(o.kast, 0)}%</td>
            <td><span class="r-cip r-${ratingSinif(o.rating)}"><span>${sayi(o.rating, 2)}</span></span></td>
          </tr>`).join('')}</tbody>
        </table></div></div>`;
    }).join('');
  }

  function zamanCiz(s, biz) {
    const r = [...(s.roundlar || [])].sort((a, b) => a.no - b.no);
    if (!r.length) return '<p>Round bilgisi yok.</p>';
    // MR12: 1–12, 13–24, sonra uzatma 6'şar
    const gruplar = [];
    r.forEach((x) => {
      const g = x.no <= 12 ? 0 : x.no <= 24 ? 1 : 2 + Math.floor((x.no - 25) / 6);
      (gruplar[g] = gruplar[g] || []).push(x);
    });
    let b = 0, o = 0;
    const killRound = r.filter((x) => x.benim_kill > 0).length;
    const hayatta = r.filter((x) => !x.ben_oldum).length;
    const html = gruplar.filter(Boolean).map((g, gi) => {
      const ad = gi === 0 ? '1. yarı' : gi === 1 ? '2. yarı' : `Uzatma ${gi - 1}`;
      let gb = 0, go = 0;
      const hucre = g.map((x) => {
        const kaz = x.kazanan_takim === biz;
        if (kaz) { b++; gb++; } else { o++; go++; }
        const ip = [`<b>Round ${x.no} · ${kaz ? 'Kazandınız' : 'Kaybettiniz'}</b>`, esc(nedenAd(x.neden)),
          `Skor ${b}–${o}`, x.benim_kill ? `${x.benim_kill} kill` : 'Kill yok', x.ben_oldum ? 'Öldün' : 'Hayatta kaldın'].join('\n');
        return `<div class="rnd" tabindex="0" data-ipucu="${esc(ip)}" aria-label="Round ${x.no}, ${kaz ? 'kazanıldı' : 'kaybedildi'}, ${x.benim_kill} kill${x.ben_oldum ? ', öldün' : ''}">
          <div class="rnd-kutu ${kaz ? 'biz' : 'onlar'} ${x.benim_kill >= 3 ? 'cok' : ''}">${x.benim_kill || ''}</div>
          <div class="rnd-olum">${x.ben_oldum ? '✕' : ''}</div>
          <div class="rnd-no">${x.no}</div></div>`;
      }).join('');
      return `<div class="yari"><div class="yari-ad">${ad}<b>${gb}–${go}</b></div><div class="rnd-dizi">${hucre}</div></div>`;
    }).join('');
    return `<div class="ozet-satir">
        <div><small>Kazanılan</small><b style="color:var(--cam)">${b}</b><span style="color:var(--soluk)"> / ${r.length}</span></div>
        <div><small>Kill aldığın</small><b>${killRound}</b><span style="color:var(--soluk)"> round</span></div>
        <div><small>Hayatta</small><b>${hayatta}</b><span style="color:var(--soluk)"> round</span></div>
      </div>
      <div class="yarilar">${html}</div>
      <div class="lejant">
        <span><i style="background:var(--cam);box-shadow:0 0 6px var(--cam)"></i>Kazandınız</span>
        <span><i style="background:var(--mac);box-shadow:0 0 6px var(--mac)"></i>Kaybettiniz</span>
        <span><b style="font-family:var(--f-baslik)">2</b> senin kill sayın</span>
        <span><span style="color:var(--kotu)">✕</span> öldün</span>
        <span><i style="border:1px solid var(--sari)"></i>3+ kill</span>
      </div>`;
  }

  function silahCiz(silahlar) {
    if (!silahlar.length) return '<p>Bu maçta kill yok.</p>';
    const l = [...silahlar].sort((a, b) => b.kill - a.kill);
    const enCok = Math.max(...l.map((x) => x.kill), 1);
    const toplamHs = l.reduce((a, x) => a + Math.min(x.hs || 0, x.kill), 0);
    const toplam = l.reduce((a, x) => a + x.kill, 0);
    return `<div class="silahlar">${l.map((x, i) => {
      const hs = Math.min(x.hs || 0, x.kill);
      return `<div class="silah" data-ipucu="<b>${esc(silahAd(x.silah))}</b>\n${x.kill} kill · ${hs} headshot (%${sayi(hs / x.kill * 100, 0)})">
        <span class="silah-ad">${esc(silahAd(x.silah))}</span>
        <div class="silah-bar" style="--i:${i}"><i class="hs" style="width:${hs / enCok * 100}%"></i><i class="dg" style="width:${(x.kill - hs) / enCok * 100}%"></i></div>
        <span class="silah-sayi">${x.kill}<small>${hs} HS</small></span></div>`;
    }).join('')}</div>
    <div class="lejant">
      <span><i style="background:var(--cam);box-shadow:0 0 6px var(--cam)"></i>Headshot</span>
      <span><i style="background:var(--mac)"></i>Diğer</span>
      <span style="margin-left:auto">Toplam <b style="font-family:var(--f-baslik);color:var(--metin)">${toplam}</b> kill · %${sayi(toplam ? toplamHs / toplam * 100 : 0, 0)} HS</span>
    </div>`;
  }

  /* ---------------- klipler + kayıt ---------------- */
  function klipVerisi(id) { return VERI.klipler[id] || (VERI.klipler[id] = { highlightlar: [], kayit: { durum: 'bos', mesaj: '', satirlar: [] } }); }
  function hedefler(k) {
    const sirali = [...k.highlightlar].sort((a, b) => b.score - a.score);
    return S.enIyi > 0 ? sirali.slice(0, S.enIyi) : sirali;
  }

  function aracGuncelle() {
    const k = klipVerisi(S.secili);
    const calisiyor = k.kayit.durum === 'calisiyor';
    const n = hedefler(k).length;
    document.querySelectorAll('#enIyiSecim button').forEach((b) => {
      b.setAttribute('aria-pressed', String(Number(b.dataset.n) === S.enIyi));
      b.disabled = calisiyor;
    });
    const d = $('kaydetDugme');
    d.disabled = calisiyor || !n;
    d.innerHTML = calisiyor ? '<span class="donen"></span> Kayıt sürüyor…'
      : `${IKON.kayit} Klipleri kaydet <small>${S.enIyi > 0 ? `en iyi ${Math.min(S.enIyi, n)}` : `hepsi · ${n}`}</small>`;
  }

  function kayitUyariCiz() {
    const kk = VERI.kontrol || {};
    const sorun = kk.sorunlar || [];
    $('kayitUyari').innerHTML = `<div class="uyari">${IKON.bilgi}<div>Kayıt CS2'yi açar ve demoyu oynatır; bitene kadar bilgisayarı kullanma. Başlamadan önce <b>FACEIT ve CS2 kapalı</b> olmalı.</div></div>`
      + (sorun.length ? `<div class="uyari tehlike">${IKON.uyari}<div><b>Kayıt öncesi kontrol</b><ul>${sorun.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></div>` : '');
  }

  function kayitAlanCiz() {
    const id = S.secili;
    const k = klipVerisi(id);
    const ky = k.kayit;
    const alan = $('kayitAlan');
    if (!alan) return;
    if (ky.durum === 'bos') { alan.innerHTML = ''; return; }
    const yuzde = ky.toplam ? Math.round((ky.adim / ky.toplam) * 100) : 100;
    const calisiyor = ky.durum === 'calisiyor';
    const logAcik = calisiyor || S.logAcik[id];
    const satir = (ky.satirlar || []).map((x) => `<span class="z">${esc(x.z)}</span>  ${x.s ? `<span class="s">${esc(x.m)}</span>` : esc(x.m)}`).join('\n');
    alan.innerHTML = `<div class="ilerleme panel neon-kenar ${calisiyor ? '' : 'bitti'}">
      <div class="ilerleme-ust">
        <b>${calisiyor ? '<span class="donen"></span>' : '✓'} ${esc(ky.mesaj)}</b>
        <span style="color:var(--soluk);font-size:.78rem">Adım ${ky.adim}/${ky.toplam}</span>
        <span class="yuzde">%${yuzde}</span>
      </div>
      <div class="cubuk ${calisiyor ? 'serit' : ''}"><div style="width:${yuzde}%"></div></div>
      ${logAcik ? `<pre class="log" id="log">${satir}</pre>` : ''}
      ${!calisiyor ? `<button type="button" class="log-ac" id="logAc">${logAcik ? 'Kayıt günlüğünü gizle' : 'Kayıt günlüğünü göster'}</button>` : ''}
    </div>`;
    const log = $('log');
    if (log) log.scrollTop = log.scrollHeight;
    const ac = $('logAc');
    if (ac) ac.onclick = () => { S.logAcik[id] = !S.logAcik[id]; kayitAlanCiz(); };
  }

  function klipleriCiz(giris = false) {
    const id = S.secili;
    const k = klipVerisi(id);
    const s = VERI.demo[id];
    const ben = benBul(s);
    const hl = [...k.highlightlar].sort((a, b) => b.score - a.score);
    const klipli = hl.filter((h) => h.klip).length;
    $('klipOzet').textContent = `${hl.length} highlight · ${klipli} klip kayıtlı`;
    aracGuncelle();
    kayitAlanCiz();
    const izgara = $('klipIzgara');
    if (!hl.length) { izgara.innerHTML = '<p style="color:var(--soluk)">Bu maçta öne çıkan an bulunamadı.</p>'; return; }
    const hedef = new Set(k.kayit.durum === 'calisiyor' ? (k.kayit.hedef || []) : []);
    izgara.innerHTML = hl.map((h, i) => {
      const kayitta = k.kayit.durum === 'calisiyor' && k.kayit.aktif === h.round;
      const sirada = hedef.has(h.round) && !kayitta && !h.yeni;
      const killSay = (() => {
        for (const l of h.labels || []) { const m = /^(\d)K$/i.exec(l); if (m) return Number(m[1]); if (/^ACE$/i.test(l)) return 5; }
        return 1;
      })();
      const hsSay = (() => { for (const l of h.labels || []) { const m = /^(\d+)\s*HS$/i.exec(l); if (m) return Number(m[1]); } return 0; })();
      const silahlar = h.weapons && h.weapons.length ? h.weapons : ['?'];
      const feed = Array.from({ length: Math.min(killSay, 4) }, (_, j) =>
        `<span>${esc(ben ? ben.ad : 'Sen')} <em>${esc(silahAd(silahlar[j % silahlar.length]))}</em>${j < hsSay ? '<i class="hs"></i>' : ''}</span>`).join('')
        + (killSay > 4 ? `<span>+${killSay - 4}</span>` : '');
      const durum = kayitta ? etk('Kaydediliyor', 'dolu-mac') : sirada ? etk('Sırada', 'orta') : h.klip ? etk('Kayıtlı', 'iyi') : etk('Kayıt bekliyor', '');
      const ic = `<div class="klip-ust">${i === 0 ? etk('En iyi an', 'dolu-cam') : ''}<span class="durum">${durum}</span></div>
        <div class="killfeed">${feed}</div>
        <span class="oynat">${IKON.oynat}</span>
        <span class="sure">${sureYaz(h.saniye || 0)}</span>`;
      const ipucu = h.klip ? `Klibi oynat — round ${h.round}` : 'Klip henüz kaydedilmedi';
      return `<article class="klip ${giris ? 'giris' : ''} ${i === 0 ? 'en-iyi' : ''} ${h.klip ? '' : 'yok'} ${kayitta ? 'kayitta' : ''}" style="--i:${i}">
        <button type="button" class="klip-resim" data-round="${h.round}" ${h.klip ? '' : 'disabled'} aria-label="${esc(ipucu)}">${sahneHtml(s.harita, ic)}</button>
        <div class="klip-govde">
          <div class="klip-satir">
            <span class="klip-round">Round<b>${esc(h.round)}</b></span>
            <span class="klip-puan">${sayi(h.score, 1)}<small>puan</small></span>
          </div>
          <div class="etiketler">${(h.labels || []).map((l) => etk(l, etiketSinif(l))).join('') || etk('—')}</div>
          <div class="klip-silah">${IKON.nisan}<span>${silahlar.map((w) => esc(silahAd(w))).join(' · ')}</span></div>
          <div class="klip-alt"><span class="nokta ${h.klip ? 'var' : ''}"></span>${h.klip ? `<code title="${esc(h.klip)}">${esc(h.klip)}</code>` : `<span>Kaydedilmedi · ${h.saniye ?? '?'} sn</span>`}</div>
        </div>
      </article>`;
    }).join('');
    izgara.onclick = (e) => {
      const b = e.target.closest('.klip-resim');
      if (!b || b.disabled) return;
      const h = k.highlightlar.find((x) => String(x.round) === b.dataset.round);
      if (h && h.klip) oynaticiAc(s, h);
    };
  }

  function kaydet() {
    const id = S.secili;
    const k = klipVerisi(id);
    if (k.kayit.durum === 'calisiyor') return;
    const s = VERI.demo[id];
    const ben = benBul(s);
    const hedef = hedefler(k);
    if (!hedef.length) return;
    const harita = (s.harita || 'demo').replace(/^de_/, '');
    const zaman = () => new Date().toLocaleTimeString('tr-TR', { hour12: false });
    const ky = k.kayit = { durum: 'calisiyor', mesaj: 'Kayıt başlatıldı…', satirlar: [], adim: 0, toplam: 0, aktif: null, hedef: hedef.map((h) => h.round) };
    const yaz = (m, basari) => ky.satirlar.push({ z: zaman(), m, s: !!basari });
    const islemler = KAYIT_LOG.map((m) => () => { const t = m.replace('{oyuncu}', ben ? ben.ad : '?'); yaz(t); ky.mesaj = t; });
    hedef.forEach((h, i) => {
      islemler.push(() => { ky.aktif = h.round; ky.mesaj = `Round ${h.round} kaydediliyor (${i + 1}/${hedef.length})…`; yaz(ky.mesaj); yaz('FFmpeg: NVENC h264 kodlama'); });
      islemler.push(() => {
        h.klip = `/klip/${harita}_${kisaId(id)}_R${h.round}.mp4`;
        yaz(`Klip yazıldı: ${h.klip.split('/').pop()}`, true);
        ky.aktif = null;
      });
    });
    islemler.push(() => { yaz('CS2 kapatılıyor'); ky.mesaj = 'CS2 kapatılıyor…'; });
    islemler.push(() => {
      yaz(`Bitti: ${hedef.length} klip kaydedildi`, true);
      ky.durum = 'bitti'; ky.mesaj = `${hedef.length} klip kaydedildi.`;
      const d = demoBul(id);
      if (d) d.klip_sayisi = k.highlightlar.filter((h) => h.klip).length;
      listeCiz();
    });
    ky.toplam = islemler.length;
    clearInterval(S.zamanlayici[id]);
    S.zamanlayici[id] = setInterval(() => {
      const f = islemler[ky.adim];
      if (!f) { clearInterval(S.zamanlayici[id]); return; }
      f();
      ky.adim++;
      if (ky.durum !== 'calisiyor') clearInterval(S.zamanlayici[id]);
      if (S.secili === id && $('klipIzgara')) klipleriCiz(false);
    }, 750);
    if (S.secili === id) klipleriCiz(false);
  }

  /* ---------------- oynatıcı (maket) ---------------- */
  function oynaticiAc(s, h) {
    const perde = $('perde');
    const sure = Math.max(h.saniye || 10, 1);
    perde.innerHTML = `<div class="oynatici panel neon-kenar" role="dialog" aria-modal="true" aria-label="Klip oynatıcı">
      <div class="oynatici-baslik">
        <h3>Round ${esc(h.round)}</h3>
        ${(h.labels || []).map((l) => etk(l, etiketSinif(l))).join('')}
        <button type="button" class="ikon-dugme" id="oyKapat" aria-label="Kapat">${IKON.kapat}</button>
      </div>
      <div style="padding:14px 16px 0"><div class="oynatici-ekran">${sahneHtml(s.harita, `<div class="oynatici-not"><b>Maket önizleme</b><code>${esc(h.klip)}</code></div>`)}</div></div>
      <div class="oynatici-kontrol">
        <button type="button" class="ikon-dugme" id="oyDugme" aria-label="Duraklat">${IKON.dur}</button>
        <div class="cubuk"><div id="oyCubuk"></div></div>
        <span class="zaman" id="oyZaman">0:00 / ${sureYaz(sure)}</span>
      </div>
    </div>`;
    perde.hidden = false;
    const oyn = perde.querySelector('.oynatici');
    let gecen = 0, son = performance.now(), calis = true, rid = 0;
    const tik = (t) => {
      if (calis) gecen = Math.min(gecen + (t - son) / 1000, sure);
      son = t;
      $('oyCubuk').style.width = (gecen / sure * 100) + '%';
      $('oyZaman').textContent = `${sureYaz(gecen)} / ${sureYaz(sure)}`;
      if (gecen >= sure) { calis = false; durumYaz(); }
      rid = requestAnimationFrame(tik);
    };
    const durumYaz = () => {
      $('oyDugme').innerHTML = calis ? IKON.dur : IKON.oynat;
      $('oyDugme').setAttribute('aria-label', calis ? 'Duraklat' : 'Oynat');
      oyn.classList.toggle('durdu', !calis);
    };
    rid = requestAnimationFrame(tik);
    $('oyDugme').onclick = () => { if (gecen >= sure) gecen = 0; calis = !calis; durumYaz(); };
    const kapat = () => { cancelAnimationFrame(rid); perde.hidden = true; perde.innerHTML = ''; document.removeEventListener('keydown', tus); };
    const tus = (e) => { if (e.key === 'Escape') kapat(); };
    $('oyKapat').onclick = kapat;
    perde.onclick = (e) => { if (e.target === perde) kapat(); };
    document.addEventListener('keydown', tus);
    $('oyKapat').focus();
  }

  /* ---------------- başlat ---------------- */
  function basla() {
    kontrolCiz();
    listeCiz();
    ipucuKur();
    surukleBirakKur();
    $('demolar').addEventListener('click', (e) => {
      const b = e.target.closest('.demo');
      if (b) demoAc(b.dataset.id);
    });
    $('yenile').addEventListener('click', () => {
      const b = $('yenile');
      b.classList.remove('donuyor'); void b.offsetWidth; b.classList.add('donuyor');
      listeCiz();
    });
    const ilk = S.demolar.find((d) => d.analiz_edildi && VERI.demo[d.id]);
    if (ilk) demoAc(ilk.id);
    else $('ana').innerHTML = '<section class="panel ortada"><div><h2>Bir demo seç</h2><p>Soldaki listeden bir demo seç ya da yeni bir demo yükle.</p></div></section>';
  }
  basla();
})();
</script>
